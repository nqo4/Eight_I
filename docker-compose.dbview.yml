# 로컬에서 DB 내용을 DBeaver·pgAdmin 같은 도구로 보고 싶을 때만 쓰는 추가 설정이다(채점·CI에는 쓰지 않는다).
# 내 컴퓨터(127.0.0.1)에서만 5433 포트로 접속할 수 있다.
#   docker compose -f docker-compose.yml -f docker-compose.dbview.yml up -d --build
# 접속 정보: 호스트 127.0.0.1 · 포트 5433 · DB app · 사용자 app · 비밀번호 app (로컬 전용 값)
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"
