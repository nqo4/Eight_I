# 앱 코드 검사: 린트 → 빌드(빌드가 생성한 라우트 타입으로) → 타입 검사.
name: checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit

  # docker compose로 app·db를 띄워 API가 DB에 붙고 오류 응답이 정상인지 본다(AI 키 없이, 비용 없음).
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: RELEASE_ID="$GITHUB_SHA" docker compose up -d --build
      - name: Wait for /__health
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/__health && exit 0; sleep 2; done
          docker compose logs app; exit 1
      - name: API checks
        run: |
          set -e
          status="$(curl -fsS http://localhost:3000/api/status)"; echo "$status"
          echo "$status" | jq -e '.store == "postgres"'
          # 로그인하지 않으면 분석 API는 401(F10)
          code="$(curl -s -o body.json -w '%{http_code}' -X POST http://localhost:3000/api/repositories/analyze \
            -H 'content-type: application/json' -d '{"url":"https://gitlab.com/a/b"}')"
          cat body.json; test "$code" = 401; jq -e '.error.code == "login_required"' body.json
          # 시드 계정으로 로그인한 뒤 오류 응답 확인
          config="$(docker compose config --format json)"
          login="$(echo "$config" | jq -c '{email: .services.app.environment.SEED_USER_EMAIL, password: .services.app.environment.SEED_USER_PASSWORD}')"
          curl -fsS -c jar.txt -X POST http://localhost:3000/api/auth/login -H 'content-type: application/json' -d "$login" > /dev/null
          code="$(curl -s -b jar.txt -o body.json -w '%{http_code}' -X POST http://localhost:3000/api/repositories/analyze \
            -H 'content-type: application/json' -d '{"url":"https://gitlab.com/a/b"}')"
          cat body.json; test "$code" = 400; jq -e '.error.code == "invalid_url"' body.json
          code="$(curl -s -b jar.txt -o body.json -w '%{http_code}' http://localhost:3000/api/analyses/nope)"
          cat body.json; test "$code" = 404; jq -e '.error.code == "analysis_not_found"' body.json
      - if: always()
        run: |
          docker compose logs app --tail 100
          docker compose down -v
