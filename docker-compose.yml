# 주최 측 실행과 CI가 이 파일로 앱을 빌드하고 띄운다(키트 docker-compose.example.yml 기준).
# - 서비스 이름 app과 "3000:3000"은 바꾸지 않는다. 앱은 컨테이너 안 0.0.0.0:3000에서 받는다.
# - app 말고는 ports·container_name이 없고, env_file을 쓰지 않는다.
# - 로그인해야 쓰는 서비스다(F10). 채점기가 SEED_USER_EMAIL·SEED_USER_PASSWORD를 E2E에 넘기고, S2~S8은 이 계정으로 로그인한다.
#   앱이 뜨면서 이 계정을 만든다(src/instrumentation.ts).
# - 앱은 처음 요청 때 DB 표를 스스로 만든다. 같은 저장소·commit을 미리 분석해 둔 결과는 data/demo/demo.json에서 읽는다.
services:
  app:
    build:
      context: .
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
    ports:
      - "3000:3000"
    environment:
      RELEASE_ID: ${RELEASE_ID:-dev}
      DATABASE_URL: postgres://app:app@db:5432/app
      SEED_USER_EMAIL: student@example.com
      SEED_USER_PASSWORD: loopthon-2026
      SEED_USER_NAME: 체험 학습자
      # 서버는 이 이름으로만 AI 키를 읽는다. 비어 있어도 앱은 뜬다(AI 분석만 안내 메시지).
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      # 로컬 테스트 전용. 비어 있으면(채점·CI) AI Gateway를 쓴다.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
