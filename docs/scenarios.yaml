document:
  id: UX-001
  title: "CodeBack | 사용자 핵심 흐름 및 시나리오"
  version: "0.1.0"
  status: "초안 — 구현·사용성 테스트 전"
  updated_at: "2026-10-29"
  linked_spec: "docs/problem.yaml"
  principle: "프로젝트 완성 이후, 기능에서 시작하여 코드 이해와 직접 수정까지"

actors:
  learner:
    label: "바이브코딩으로 웹앱을 만든 개발 입문자"
    prior_knowledge: "서비스 화면과 주요 기능은 알지만 파일 구조와 코드 동작은 익숙하지 않음"
    main_goal: "내 프로젝트의 한 기능을 설명하고 스스로 작은 변경을 적용하기"
  system:
    label: "CodeBack 학습 웹앱"
  external:
    - "GitHub (공개 저장소 읽기)"
    - "LLM (근거 기반 기능 분석과 학습 내용 생성)"

golden_path:
  id: FLOW-01
  title: "내 프로젝트로 첫 학습을 완료하는 여정"
  starting_point: "기존 바이브코딩 프로젝트의 공개 GitHub URL을 가지고 있음"
  steps:
    - order: 1
      scenario: SC-01
      screen: "프로젝트 연결"
      user_action: "GitHub URL을 입력하고 분석을 요청"
      system_response: "저장소를 읽고 앱 목적·기술 스택·분석 현황을 표시"
    - order: 2
      scenario: SC-02
      screen: "프로젝트 전체 보기"
      user_action: "기능 목록을 둘러보고 궁금한 기능을 선택"
      system_response: "선택 기능의 주요 구성요소와 확인된 근거 파일 표시"
    - order: 3
      scenario: SC-03
      screen: "기능 동작 흐름"
      user_action: "기능이 어떻게 동작하는지 단계별로 확인하고 파일을 클릭"
      system_response: "UI→로직→API 등 확인 가능한 흐름과 실제 코드 위치 표시"
    - order: 4
      scenario: SC-04
      screen: "내 코드로 개념 배우기"
      user_action: "설명을 읽으며 해당 코드와 개념을 연결"
      system_response: "왜 해당 코드가 필요한지 초보자 눈높이로 설명"
    - order: 5
      scenario: SC-05
      screen: "이해도 확인"
      user_action: "짧은 퀴즈에 답함"
      system_response: "정답 여부와 근거 코드 기반 해설 제공"
    - order: 6
      scenario: SC-06
      screen: "직접 바꿔보기"
      user_action: "작은 수정 미션을 받아 개발 환경에서 직접 코드를 변경"
      system_response: "수정 위치, 힌트, 성공 체크리스트 제시"
  done_when:
    - "학습자가 한 기능에 연결된 파일과 핵심 개념을 설명할 수 있다."
    - "학습자가 AI 자동 수정 없이 작은 변경을 직접 시도한다."
  important_caveat: "퀴즈 통과와 수정 미션 체크는 실제 코드 실행 성공을 보증하지 않는다."

scenarios:
  - id: SC-01
    title: "공개 GitHub 프로젝트 연결"
    priority: P0
    persona: learner
    related_requirements: ["FR-01", "FR-02", "FR-03"]
    preconditions:
      - "사용자는 공개된 React/Next.js GitHub 저장소 URL을 알고 있다."
      - "저장소의 기본 브랜치와 소스 파일에 접근 가능하다."
    trigger: "홈 화면에서 '내 프로젝트 분석하기' 클릭"
    main_flow:
      - "사용자가 https://github.com/{owner}/{repo} 형태의 URL을 입력한다."
      - "서비스가 URL 형식을 확인하고 공개 저장소 정보를 요청한다."
      - "분석 대상 파일에서 생성물·바이너리·민감 파일을 제외한다."
      - "파일·설정 내용을 근거로 기술 스택과 대략적 프로젝트 목적을 표시한다."
      - "사용자를 기능 목록 화면으로 이동시킨다."
    output:
      - "저장소 이름·브랜치·분석 기준 commit SHA"
      - "프로젝트 한 줄 소개와 확인 가능한 기술 스택"
      - "분석 중/성공/실패 상태"
    alternate_flows:
      - condition: "잘못된 URL 또는 접근 불가 저장소"
        behavior: "원인을 안내하고 다시 입력할 수 있도록 한다."
      - condition: "GitHub rate limit 또는 네트워크 오류"
        behavior: "재시도 안내와 공개 샘플 데모 모드를 제공한다."
    acceptance_criteria:
      - "유효한 공개 저장소는 분석 완료 후 다음 단계로 진행할 수 있다."
      - "유효하지 않은 URL로 앱이 중단되거나 빈 결과가 성공처럼 노출되지 않는다."

  - id: SC-02
    title: "전체 구조에서 배우고 싶은 기능 찾기"
    priority: P0
    persona: learner
    related_requirements: ["FR-03", "FR-04"]
    preconditions: ["SC-01에서 프로젝트 분석을 완료했다."]
    trigger: "프로젝트 분석 결과 화면 도착"
    main_flow:
      - "사용자가 앱의 목적과 사용된 기술 스택을 훑어본다."
      - "서비스가 코드 근거가 있는 주요 기능을 카드로 보여준다."
      - "사용자가 '로그인', '상품 검색' 등 이해하고 싶은 기능 하나를 고른다."
      - "선택 기능과 관련이 있다고 확인된 파일 목록을 연다."
    output: "선택 기능의 제목, 한 줄 설명, 근거 파일, 이해하기 쉬운 흐름 미리보기"
    alternate_flows:
      - condition: "기능을 충분히 추출하지 못함"
        behavior: "추출 불가 사유를 보여주며 가능한 파일·구조 요약만 제공한다."
      - condition: "기술 스택이 지원 범위 밖임"
        behavior: "지원 범위를 알리고 제한된 구조 보기 또는 데모 모드로 안내한다."
    acceptance_criteria:
      - "표시된 기능마다 적어도 한 개의 실제 파일 근거가 있다."
      - "실제 코드에서 확인되지 않은 기능은 존재한다고 단정하지 않는다."

  - id: SC-03
    title: "기능의 동작 흐름과 실제 코드 연결"
    priority: P0
    persona: learner
    related_requirements: ["FR-05"]
    preconditions: ["SC-02에서 기능을 선택했다."]
    trigger: "'이 기능 어떻게 동작해?' 클릭"
    main_flow:
      - "서비스가 기능의 시작점과 역할별 파일을 보여준다."
      - "검증된 연결만 UI·상태/로직·서버/API 등 단계로 표시한다."
      - "사용자가 하나의 파일 카드를 클릭한다."
      - "서비스가 해당 파일의 실제 관련 코드와 라인 번호를 강조해 보여준다."
      - "사용자가 이전 단계·다음 단계로 이동하며 전체 흐름을 따라간다."
    output: "기능 동작 단계, 코드 참조(path/start_line/end_line/commit_sha), 요약 설명"
    alternate_flows:
      - condition: "실제 호출·데이터 관계를 확인하지 못함"
        behavior: "연결 미확인 또는 AI 추정으로 구별하고 임의의 실행 흐름을 만들지 않는다."
      - condition: "연결한 뒤 저장소가 업데이트됨"
        behavior: "분석 시점 commit SHA의 파일·라인을 사용한다."
    acceptance_criteria:
      - "코드 카드에서 실제 파일과 일치하는 경로 및 라인 범위를 확인할 수 있다."
      - "없는 함수·파일을 학습 근거로 생성하지 않는다."

  - id: SC-04
    title: "내 코드로 개념을 Top-down 학습"
    priority: P0
    persona: learner
    related_requirements: ["FR-06"]
    preconditions: ["SC-03에서 하나 이상의 실제 코드 위치를 확인했다."]
    trigger: "'이 코드 배우기' 클릭"
    main_flow:
      - "먼저 선택 기능이 사용자에게 어떤 결과를 만드는지 설명한다."
      - "다음으로 관련 파일 각각이 맡은 일을 설명한다."
      - "관련된 실제 코드 몇 줄을 보여주고 핵심 표현을 강조한다."
      - "React state, 이벤트, API 요청 등 실제 코드에 존재하는 개념만 풀이한다."
      - "사용자가 필요하면 쉬운 비유·용어 설명을 펼쳐본다."
    output: "기능→파일 역할→코드 근거→핵심 개념으로 연결된 학습 내용"
    acceptance_criteria:
      - "설명한 개념이 하나 이상의 실제 코드 범위에 연결된다."
      - "설명 순서가 초보자의 기능 이해에서 세부 코드 이해로 자연스럽게 이어진다."

  - id: SC-05
    title: "배운 기능의 이해도 확인"
    priority: P0
    persona: learner
    related_requirements: ["FR-07"]
    preconditions: ["SC-04에서 학습 내용을 확인했다."]
    trigger: "'이해도 확인' 클릭"
    main_flow:
      - "서비스가 방금 살펴본 기능과 관련된 질문 1~3개를 표시한다."
      - "사용자가 답을 선택한다."
      - "서비스가 정답 여부와 이유, 참고할 실제 코드 위치를 보여준다."
      - "틀린 경우 해당 개념 설명으로 돌아갈 수 있다."
    output: "질문·선택한 답·정답·해설·관련 코드 근거"
    acceptance_criteria:
      - "퀴즈가 일반 상식이 아니라 현재 선택한 기능과 연결되어 있다."
      - "오답일 때 정답만 보여주지 않고 이유를 설명한다."

  - id: SC-06
    title: "작은 기능을 스스로 수정해 보기"
    priority: P0
    persona: learner
    related_requirements: ["FR-08"]
    preconditions: ["SC-03~SC-05에서 관련 코드 위치와 개념을 학습했다."]
    trigger: "'이제 네가 직접 바꿔봐' 클릭"
    main_flow:
      - "서비스가 현재 기능에 맞는 작고 구체적인 변경 목표를 제안한다."
      - "수정해야 할 것으로 예상되는 파일·라인과 힌트를 보여준다."
      - "사용자가 자신의 IDE에서 직접 코드를 수정한다."
      - "사용자가 앱을 직접 실행해 성공 조건을 확인하도록 안내한다."
      - "사용자는 성공 체크리스트를 수동으로 완료하고 배운 개념을 정리한다."
    output: "변경 미션, 관련 코드, 성공 조건, 학습 회고"
    example_only:
      feature: "장바구니에 상품 담기"
      task: "장바구니에 같은 상품을 최대 10개까지만 담을 수 있게 바꿔 보기"
      learning_concepts: ["이벤트 처리", "상태 업데이트", "조건문"]
      note: "가상 프로젝트 예시이며 실제 분석된 파일·라인을 의미하지 않음"
    alternate_flows:
      - condition: "사용자가 너무 어렵다고 느낌"
        behavior: "최소 힌트 → 개념 힌트 → 수정 대상 코드 힌트를 순차 제공한다."
      - condition: "시스템이 안전한 미션을 만들 근거가 부족함"
        behavior: "코드 수정 대신 기능의 입력·출력을 설명하는 관찰 미션을 제안한다."
    acceptance_criteria:
      - "목표와 성공 조건이 구체적이다."
      - "서비스가 사용자 대신 코드를 자동 수정하거나 커밋하지 않는다."
      - "완료 체크는 자기 보고이며 실제 정답 보증이 아님을 표시한다."

  - id: SC-07
    title: "직접 수정한 코드에 대한 정적 피드백 받기"
    priority: P1
    persona: learner
    related_requirements: ["FR-09"]
    preconditions: ["SC-06의 수정 미션을 받은 후 코드 조각 또는 diff를 준비했다."]
    trigger: "'내가 수정한 코드 확인' 클릭"
    main_flow:
      - "사용자가 변경한 코드 조각이나 diff를 입력한다."
      - "서비스가 민감정보 포함 위험을 확인한다."
      - "서비스가 기존 파일의 맥락과 성공 조건을 기준으로 변경을 비교한다."
      - "서비스가 충족 가능성, 놓친 조건, 개선 힌트를 설명한다."
    output: "정적 분석 수준의 피드백, 체크리스트, 다음 학습 제안"
    alternate_flows:
      - condition: "실행해야만 확인 가능한 변경"
        behavior: "정적 확인 한계를 밝히고 사용자에게 로컬 실행 검증을 안내한다."
      - condition: "비밀키·자격증명처럼 보이는 텍스트 검출"
        behavior: "전송하지 말고 먼저 제거하도록 경고한다."
    acceptance_criteria:
      - "피드백에서 코드를 실제로 실행한 것처럼 말하지 않는다."

  - id: SC-08
    title: "GitHub 오류에도 데모 학습 계속하기"
    priority: P0
    persona: learner
    related_requirements: ["FR-01", "FR-10"]
    preconditions: ["외부 연결에 실패했거나 사용자가 직접 저장소를 준비하지 못했다."]
    trigger: "'샘플로 체험하기' 클릭"
    main_flow:
      - "서비스가 사전 선정된 공개 샘플 프로젝트를 불러온다."
      - "데모 모드라는 표시와 샘플 프로젝트 이름을 보여준다."
      - "사용자가 SC-02부터 SC-06까지 동일한 흐름을 경험한다."
    output: "외부 연결 장애 시에도 시연 가능한 학습 흐름"
    acceptance_criteria:
      - "샘플 데이터를 사용자 자신의 저장소 분석 결과라고 표시하지 않는다."
      - "샘플 코드 경로와 라인도 실제 준비한 샘플과 일치한다."

experience_rules:
  navigation:
    - "홈 → 프로젝트 개요 → 기능 선택 → 코드 흐름 → 개념 학습 → 퀴즈 → 수정 미션"
    - "현재 단계와 다음 행동을 한 번에 이해할 수 있도록 표시"
    - "이전 단계로 이동해도 같은 분석 기준의 파일과 내용을 참조"
  learning_tone:
    - "초보자가 이해할 수 있는 쉬운 한국어"
    - "문법 정의만 제시하지 않고 '내 서비스에서 왜 필요한가'를 먼저 설명"
    - "전문 용어를 사용할 때는 짧은 풀이와 실제 코드 예시 병기"
  source_grounding:
    - "모든 코드 위치는 실제 수집한 path/start_line/end_line/commit_sha에 연결"
    - "검증된 사실·추정·데모 예시를 시각적으로 구분"
    - "애매하면 모른다고 말하고 존재하지 않는 기능을 만들지 않음"

demo_script:
  title: "SUMTECH 3~5분 핵심 시연안"
  setup: "사전에 검증한 소형 공개 React/Next.js 샘플 저장소를 준비한다."
  moments:
    - "0:00 — 바이브코딩으로 앱을 만들었지만 어디를 고쳐야 할지 모르는 문제 제시"
    - "0:30 — GitHub URL을 넣고 프로젝트의 기능 카드 확인"
    - "1:20 — 기능 하나를 클릭해 실제 파일 및 코드 라인으로 이동"
