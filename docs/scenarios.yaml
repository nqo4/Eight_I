# 회원가입·로그인(FR-13)은 있지만 아래 흐름은 모두 로그인 없이 동작한다(account 미사용). 흐름마다 홈(/)에서 시작하고 앞 흐름이 만든 데이터에 기대지 않는다.
# S1만 실제 공개 GitHub 저장소 + AI 분석을 호출한다(1분 안에 끝나는 소형 공개 샘플 저장소). S2~S8은 '샘플로 체험하기'의 샘플 프로젝트에서 시작한다(FR-10).
# 버튼 이름은 여기 적힌 그대로 구현한다. 이름을 바꾸면 이 파일과 e2e/scenarios/<id>.spec.ts를 같은 commit에서 고친다.
# 정적 피드백(FR-09, 우선순위 P1)은 대회 흐름에서 제외한다.
platform: desktop
platformReason: |
  대상은 AI 코딩 도구로 캡스톤·포트폴리오를 만든 SW 전공자와, 전공 지식 없이 AI 코딩 도구로 서비스를 만든 학생이다(problem.yaml customer·P1·P2).
  이들이 이 서비스를 여는 순간은 E1처럼 해커톤이 끝난 뒤 서비스를 고치려 할 때, E2처럼 몇 달 전 프로젝트를 다시 열어 기능을 추가하려 할 때,
  면접·발표를 앞두고 내 프로젝트를 설명할 준비를 할 때이고, 모두 노트북 앞에서 IDE를 함께 띄워 둔 상태다.
  화면·서버·DB 파일의 코드 발췌와 라인 번호를 읽으면서 자기 IDE에서 직접 고치는 흐름(FR-05·FR-08·FR-11)이라 넓은 화면이 필요하다.
scenarios:
  - id: S1
    title: 학습자가 공개 GitHub 프로젝트를 연결해 프로젝트 소개와 사용한 기술·기능 목록을 받는다
    steps:
      - 홈에서 '내 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 공개 샘플 저장소 주소를 입력한다"
      - "'분석 시작'을 누른다"
    expected: 저장소 이름, 기본 브랜치, 분석 기준 commit SHA, 프로젝트 소개가 보이고, '사용한 기술' 구역에 기술 이름·근거 파일 경로·역할이, '기능' 구역에 근거 파일 경로가 붙은 기능이 2개 이상 표시된다
  - id: S2
    title: 학습자가 데모 모드에서 프로젝트에 쓰인 기술을 골라 그 역할과 쓰인 코드를 배운다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - "'사용한 기술' 목록에서 첫 번째 기술을 누른다"
    expected: "'데모 모드' 표시와 샘플 프로젝트 이름이 보이고 '내 저장소 분석 결과'라는 표현이 없으며, 선택한 기술의 이름, 이 프로젝트에서 맡은 역할, 핵심 개념 설명, 그 기술이 쓰인 파일 경로와 라인이 1개 이상 표시된다"
  - id: S3
    title: 학습자가 고른 기능이 화면·서버·DB의 어느 파일에서 동작하는지 따라간다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이 기능 어떻게 동작해?'를 누른다"
      - 흐름의 첫 번째 파일 카드를 누른다
      - "'다음 단계'를 누른다"
    expected: 흐름이 화면·상태/로직·서버/API·DB 단계로 나뉘어 보이고, 첫 번째 파일 카드에 파일 경로와 시작·끝 라인이 적힌 코드 발췌가 강조되며, 두 번째 단계의 파일 카드가 열린다
  - id: S4
    title: 학습자가 고른 기능을 개념까지 배우고 왜 이렇게 구현됐는지 이해한다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이 코드 배우기'를 누른다"
      - "'쉬운 설명 펼치기'를 누른다"
    expected: 기능 설명, 파일 역할, 중요한 코드, 핵심 개념의 4개 섹션과 '왜 이렇게 만들었나' 설명이 보이고, 핵심 개념에 파일 경로와 라인 범위가 붙어 있으며, 용어 풀이와 '왜 필요한가' 설명이 펼쳐진다
  - id: S5
    title: 학습자가 배운 기능의 이해도를 퀴즈로 확인한다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이해도 확인'을 누른다"
      - 첫 번째 질문의 보기 하나를 누른다
      - "'정답 확인'을 누른다"
    expected: 정답 또는 오답 결과와 그 이유, 참고할 코드 위치(파일 경로와 라인)가 보인다
  - id: S6
    title: 학습자가 수정 미션을 받아 자기 개발 환경에서 직접 고치고 완료를 표시한다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이제 네가 직접 바꿔봐'를 누른다"
      - 성공 조건 체크박스를 모두 누른다
      - "'완료로 표시'를 누른다"
    expected: 변경 목표, 예상 수정 파일·라인, 힌트, 성공 조건이 보이고 완료 상태로 바뀌며, 완료 표시 옆에 '자기 보고이며 실행 결과를 보증하지 않음' 문구가 보인다
  - id: S7
    title: 학습자가 바꾸고 싶은 동작을 문장으로 넣어 고칠 위치를 찾는다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - "'어디를 고쳐야 해?' 입력란 아래의 첫 번째 예시 문장을 누른다"
      - "'위치 찾기'를 누른다"
    expected: 고칠 파일 경로와 라인이 1개 이상 보이고, 위치마다 '화면'·'서버'·'DB' 중 하나와 그곳을 고치면 되는 이유가 표시되며, 수정된 코드는 보이지 않는다
  - id: S8
    title: 학습자가 다음에 다시 볼 수 있도록 프로젝트 학습 노트를 내려받는다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - "'학습 노트 내려받기'를 누른다"
    expected: PDF 파일이 내려받아지고, 파일 안에 샘플 프로젝트 이름, 화면에 보인 것과 같은 분석 기준 commit SHA, 프로젝트 소개, 사용한 기술과 기능별 근거 파일 경로가 들어 있다
