# 로그인해야 쓰는 서비스다(FR-10). S1은 회원가입부터 하므로 account를 쓰지 않고, S2~S8은 시드 계정 역할 '학습자'로 로그인한 뒤 시작한다.
# 흐름마다 홈(/)에서 공개 샘플 저장소 https://github.com/nextjs/saas-starter 를 새로 분석하고, 앞 흐름이 만든 데이터에 기대지 않는다.
# 버튼 이름은 여기 적힌 그대로 구현한다. 이름을 바꾸면 이 파일과 e2e/scenarios/<id>.spec.ts를 같은 commit에서 고친다.
# 정적 피드백(FR-09, 우선순위 P1)은 대회 흐름에서 제외한다.
platform: desktop
platformReason: |
  대상은 AI 코딩 도구로 캡스톤·포트폴리오를 만든 개발 지망 대학생과, 예전에 AI와 만든 프로젝트를 다시 열어야 하는 개발자다(problem.yaml statement·P1·P2).
  이들이 이 서비스를 여는 순간은 E1처럼 해커톤이 끝난 뒤 서비스를 고치려 할 때, E2처럼 몇 달 전 프로젝트를 다시 열어 기능을 추가하려 할 때,
  면접·발표를 앞두고 내 프로젝트를 설명할 준비를 할 때이고, 모두 노트북 앞에서 IDE를 함께 띄워 둔 상태다.
  화면·서버·DB 파일의 코드 발췌와 라인 번호를 읽으면서 자기 IDE에서 직접 고치는 흐름(FR-05·FR-08·FR-11)이라 넓은 화면이 필요하다.
scenarios:
  - id: S1
    title: 처음 온 학습자가 회원가입하고 첫 저장소를 분석해 프로젝트 소개와 사용한 기술·기능 목록을 받는다
    steps:
      - 홈 위쪽의 '로그인'을 누른다
      - 로그인 화면 아래의 '회원가입'을 누른다
      - "'이름' 입력란에 '테스트 학습자'를 입력한다"
      - "'이메일' 입력란에 새 이메일 주소를 입력한다"
      - "'비밀번호' 입력란에 8자 이상 비밀번호를 입력한다"
      - "'회원가입' 버튼을 누른다"
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
    expected: 홈 오른쪽 위에 '테스트 학습자님'과 '로그아웃'이 보이고, 저장소 이름, 기본 브랜치, 분석 기준 commit SHA, 프로젝트 한 줄 소개, 기술 스택 요약, 주요 폴더 역할이 보이며, '사용한 기술' 구역에 기술 이름·근거 파일 경로·역할이, '기능' 구역에 근거 파일 경로가 붙은 기능이 2개 이상 표시된다
  - id: S2
    title: 학습자가 분석한 저장소에 쓰인 기술을 골라 그 역할과 쓰인 코드를 배운다
    account: 학습자
    steps:
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
      - "'사용한 기술' 목록에서 첫 번째 기술을 누른다"
    expected: 선택한 기술의 이름, 이 프로젝트에서 맡은 역할, 핵심 개념 설명, 그 기술이 쓰인 파일 경로와 라인이 1개 이상 표시된다
  - id: S3
    title: 학습자가 고른 기능이 화면·서버·DB의 어느 파일에서 동작하는지 따라간다
    account: 학습자
    steps:
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이 기능 어떻게 동작해?'를 누른다"
      - 흐름의 첫 번째 파일 카드를 누른다
      - "'다음 단계'를 누른다"
    expected: 흐름이 화면·상태/로직·서버/API·DB 단계로 나뉘어 보이고, 첫 번째 파일 카드에 파일 경로와 시작·끝 라인이 적힌 코드 발췌가 강조되며, 두 번째 단계의 파일 카드가 열린다
  - id: S4
    title: 학습자가 고른 기능을 개념까지 배우고 왜 이렇게 구현됐는지 이해한다
    account: 학습자
    steps:
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이 코드 배우기'를 누른다"
      - "'쉬운 설명 펼치기'를 누른다"
    expected: 기능 설명, 파일 역할, 중요한 코드, 핵심 개념의 4개 섹션과 '왜 이렇게 만들었나' 설명이 보이고, 핵심 개념에 파일 경로와 라인 범위가 붙어 있으며, 용어 풀이와 '왜 필요한가' 설명이 펼쳐진다
  - id: S5
    title: 학습자가 배운 기능의 이해도를 퀴즈로 확인한다
    account: 학습자
    steps:
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이해도 확인'을 누른다"
      - 첫 번째 질문의 보기 하나를 누른다
      - "'정답 확인'을 누른다"
    expected: 정답 또는 오답 결과와 그 이유, 참고할 코드 위치(파일 경로와 라인)가 보인다
  - id: S6
    title: 학습자가 수정 미션을 채점받고 내 학습 기록에서 저장된 점수를 확인한다
    account: 학습자
    steps:
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
      - "'기능' 목록에서 첫 번째 기능을 누른다"
      - "'이제 네가 직접 바꿔봐'를 누른다"
      - "'고친 코드' 입력란에 고친 코드를 붙여 넣는다"
      - "'채점하기'를 누른다"
      - 화면 위쪽의 '내 학습 기록'을 누른다
    expected: "'내 학습 기록'에 nextjs/saas-starter 저장소가 분석 날짜·분석 기준 commit SHA와 함께 보이고, 그 저장소의 첫 번째 기능에 채점 화면에 보인 것과 같은 수정 미션 점수(0~100점)가 표시된다"
  - id: S7
    title: 학습자가 바꾸고 싶은 동작을 문장으로 넣어 고칠 위치를 찾는다
    account: 학습자
    steps:
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
      - "'어디를 고쳐야 해?' 입력란 아래의 첫 번째 예시 문장을 누른다"
      - "'위치 찾기'를 누른다"
    expected: 고칠 파일 경로와 라인이 1개 이상 보이고, 위치마다 '화면'·'서버'·'DB' 중 하나와 그곳을 고치면 되는 이유, 원래 코드에서 바꿔야 하는 줄이 하이라이트된 코드 발췌가 표시되며, 수정된 코드는 보이지 않는다
  - id: S8
    title: 학습자가 다음에 다시 볼 수 있도록 프로젝트 학습 노트를 내려받는다
    account: 학습자
    steps:
      - 홈에서 'GitHub 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 https://github.com/nextjs/saas-starter 를 입력한다"
      - "'분석 시작'을 누른다"
      - "'학습 노트 내려받기'를 누른다"
    expected: PDF 파일이 내려받아지고, 파일 안에 nextjs/saas-starter 저장소 이름, 화면에 보인 것과 같은 분석 기준 commit SHA, 프로젝트 소개, 사용한 기술과 기능별 근거 파일 경로가 들어 있다
