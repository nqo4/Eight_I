# 로그인 없음(account 미사용). 흐름마다 홈(/)에서 시작하고 앞 흐름이 만든 데이터에 기대지 않는다.
# S1만 실제 공개 GitHub 저장소 + AI 분석을 호출한다(1분 안에 끝나는 소형 공개 샘플 저장소). S2~S7은 '샘플로 체험하기'의 샘플 프로젝트에서 시작한다(FR-10).
# 버튼 이름은 여기 적힌 그대로 구현한다. 이름을 바꾸면 이 파일과 e2e/scenarios/<id>.spec.ts를 같은 commit에서 고친다.
# 정적 피드백(FR-09, 우선순위 P1)은 대회 흐름에서 제외한다.
platform: desktop
platformReason: |
  대상은 AI 코딩 도구로 캡스톤·포트폴리오를 만든 SW 전공 3~4학년과, 전공 지식 없이 AI 코딩 도구로 서비스를 만든 학생·비전공자다(problem.yaml customer·P1).
  이들이 이 서비스를 여는 순간은 프로젝트를 완성한 직후 기능을 고치려 할 때, 면접·발표를 앞두고 내 프로젝트를 설명할 준비를 할 때,
  예전 프로젝트를 다시 열었을 때이고, 모두 노트북 앞에서 IDE를 함께 띄워 둔 상태다.
  코드 발췌와 라인 번호를 읽으면서 자기 IDE에서 직접 수정하는 흐름(FR-05·FR-08)이라 넓은 화면이 필요하다.
scenarios:
  - id: S1
    title: 학습자가 공개 GitHub 프로젝트를 연결해 프로젝트 개요와 기능 카드를 받는다
    steps:
      - 홈에서 '내 프로젝트 분석하기'를 누른다
      - "'GitHub 저장소 URL' 입력란에 공개 샘플 저장소 주소를 입력한다"
      - "'분석 시작'을 누른다"
    expected: 저장소 이름, 기본 브랜치, 분석 기준 commit SHA, 프로젝트 한 줄 소개, 기술 스택이 보이고 기능 카드가 1개 이상 표시된다
  - id: S2
    title: 학습자가 샘플 프로젝트에서 배우고 싶은 기능을 고른다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - 기능 카드 중 첫 번째 카드를 누른다
    expected: 선택한 기능의 제목, 한 줄 설명, 근거 파일 경로 1개 이상이 보이고 '이 기능 어떻게 동작해?' 버튼이 나타난다
  - id: S3
    title: 학습자가 고른 기능의 동작 흐름을 실제 코드 위치까지 따라간다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - 기능 카드 중 첫 번째 카드를 누른다
      - "'이 기능 어떻게 동작해?'를 누른다"
      - 흐름의 첫 번째 파일 카드를 누른다
      - "'다음 단계'를 누른다"
    expected: 파일 경로와 시작·끝 라인 번호가 적힌 코드 발췌가 강조되어 보이고, 두 번째 단계의 파일 카드가 열린다
  - id: S4
    title: 학습자가 고른 기능을 기능→파일 역할→코드→개념 순서로 배운다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - 기능 카드 중 첫 번째 카드를 누른다
      - "'이 코드 배우기'를 누른다"
      - "'쉬운 설명 펼치기'를 누른다"
    expected: 기능 설명, 파일 역할, 중요한 코드, 핵심 개념의 4개 섹션이 보이고 개념 설명에 파일 경로와 라인 범위가 붙어 있으며, 용어 풀이와 '왜 필요한가' 설명이 펼쳐진다
  - id: S5
    title: 학습자가 배운 기능의 이해도를 퀴즈로 확인한다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - 기능 카드 중 첫 번째 카드를 누른다
      - "'이해도 확인'을 누른다"
      - 첫 번째 질문의 보기 하나를 누른다
      - "'정답 확인'을 누른다"
    expected: 정답 또는 오답 결과와 그 이유, 참고할 코드 위치(파일 경로와 라인)가 보인다
  - id: S6
    title: 학습자가 수정 미션을 받아 자기 개발 환경에서 직접 고치고 완료를 표시한다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
      - 기능 카드 중 첫 번째 카드를 누른다
      - "'이제 네가 직접 바꿔봐'를 누른다"
      - 성공 조건 체크박스를 모두 누른다
      - "'완료로 표시'를 누른다"
    expected: 변경 목표, 예상 수정 파일·라인, 힌트, 성공 조건이 보이고 완료 표시 옆에 '자기 보고이며 실행 결과를 보증하지 않음' 문구가 보인다
  - id: S7
    title: 학습자가 저장소 없이 샘플로 체험하기(데모 모드)에 들어간다
    steps:
      - 홈에서 '샘플로 체험하기'를 누른다
    expected: "'데모 모드' 표시와 샘플 프로젝트 이름이 보이고 기능 카드가 2개 이상 표시되며 '내 저장소 분석 결과'라는 표현이 없다"
