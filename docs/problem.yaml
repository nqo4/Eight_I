statement: >-
  바이브코딩으로 프로젝트를 완성한 개발 지망 대학생과 신인 개발자는, 기능을 고치거나
  면접·발표에서 설명해야 하는 순간에 자기 프로젝트에 쓰인 기술과 기능이 어떻게 굴러가는지 모른다는 것을 알게 되고,
  다시 AI에 기대거나 벼락치기로 넘기기 때문에 "만들 수는 있지만 고칠 수는 없는" 상태가 계속되고 그 지식이 자기 실력으로 남지 않는다.
canvas:
  context: |-
    장소와 무관하게, 바이브코딩으로 프로젝트를 진행할 때 개발자가 자신의 프로젝트에 사용된 기술·기능을 모를 때 일어난다.
    특히 세 시점에 반복된다. ① 완성 직후 기능을 추가·수정해야 할 때 ② 기술 면접·캡스톤 발표에서 "이거 어떻게 동작해요?"를 들을 때
    ③ 시간이 지나 예전 프로젝트를 다시 열었을 때.
    반복 양상(SRC-6): 바이브코딩은 "즉시 성공" 경험(경험 기록의 64%)으로 시작하지만, 코드가 복잡해지거나 버그가 생기면 11%는 고치지 못하고
    프로젝트를 포기했고, 검증 관행의 36%는 테스트를 건너뛰고 18%는 확인 없이 믿고 10%는 검증까지 AI에 맡겼다.
    GitHub에 올라간 코드는 보이지만, DB·서버·배포가 어떻게 이어지는지는 코드만 봐서는 보이지 않는다.
  customer: |-
    신인 개발자, 개발자를 지망하는 대학생, 진행했던 프로젝트 내용이 잘 기억나지 않는 개발자.
    가장 자주 겪는 사람: AI 코딩 도구(Cursor·Claude Code 등)로 캡스톤·포트폴리오를 만들고 취업 면접을 앞둔 SW 전공 3~4학년.
    처지: 포트폴리오는 있는데 "내가 만든 게 맞나"를 스스로 확신하지 못하고, 면접에서 꼬리 질문이 오면 막힌다.
    논문은 이들을 "새로운 부류의 취약한 개발자(vulnerable developers)" — 만들 수는 있지만 문제가 생기면 진단·수정하지 못하는 사람 — 라고 부른다(SRC-6).
  root_problem: |-
    AI에 너무 의존하고(①), 기술 이해보다 빠른 완성에 집중하기(②) 때문이다. 바이브코더의 가장 큰 동기는 속도(동기 기록의 62%)이고,
    그 결과 코드 작성뿐 아니라 검증까지 AI에 맡기는 "재프롬프트-붙여넣기 반복(초보 개발자 함정)"에 갇혀 의도와 구현의 연결이 끊긴다(SRC-6).
    아직 아무도 고치지 못한 이유: 코드 생성 도구는 빨리 만드는 데 맞춰져 있고, 교육은 범용 문법을 가르칠 뿐 "완성된 내 프로젝트의 실제 기능에서
    출발해 구조·코드·개념을 연결하고 직접 수정까지 확인하는 과정"이 둘 사이에 비어 있다. 논문도 도구에 단계별 설명(walkthrough)·시각 다이어그램·
    인라인 설명과 안내된 디버깅 발판을 넣으라고 권고하지만, 아직 그런 도구가 일반화되지 않았다(SRC-6). AI 도움이 이해도를 떨어뜨린다는 실험 결과(SRC-5)도 같은 방향이다.
  impact:
    feeling: "개발자라는 직업에 대한 회의감. '실제 나의 실력·기술이 되지 못한다'는 불안. 면접·발표 앞에서 '내 프로젝트인데 설명을 못 한다'는 답답함. 만들 때는 '마법 같다'고 느끼다가 고장 나면 막막해지는 낙차(SRC-6: 즉시 성공 경험이 정확하다는 착각을 만든다)."
    measurable: |-
      외부 데이터(sources 참조):
      - CS1 학생이 LLM이 만든 코드를 이해하는 과제의 성공률은 32.5%에 그쳤다 (SRC-6이 인용한 Zi et al.).
      - 바이브코딩 경험 기록 132건 중 11%는 코드 붕괴·포기로 끝났고, 품질 인식 114건 중 68%는 "빠르지만 결함 있음", 19%는 "취약하거나 오류가 잦음"이었다 (SRC-6).
      - 검증 관행 132건 중 36%는 테스트 생략, 18%는 확인 없는 신뢰, 10%는 AI에 검증 위임, 5%는 디버깅 대신 재프롬프트 (SRC-6).
      - 개발자의 66%가 "AI 결과가 거의 맞지만 완전히 맞지는 않다"를 가장 큰 불만으로, 45%가 "AI가 만든 코드를 디버깅하는 데 시간이 더 든다"고 답했다 (SRC-4, Stack Overflow 2025).
      - 무작위 대조 실험(개발자 52명)에서 AI 도움을 받아 코딩한 집단은 방금 쓴 개념 퀴즈에서 손으로 코딩한 집단보다 17% 낮은 점수를 받았고, 속도 이득은 유의하지 않았다 (SRC-5, Anthropic).
      - 생성형 AI를 써 본 4~6년제 대학생 726명 조사에서 91.7%가 과제·자료 검색에 AI를 활용했다 (SRC-2·SRC-3, 한국직업능력연구원).
      우리 팀 자체 수치: 미측정 — 같은 수정 요청을 AI에게 반복한 횟수, 면접·발표에서 꼬리 질문에 막힌 횟수를 팀원 인터뷰로 기입
  alternatives:
    - how_used: "A1. 기술 면접이 다가올 때 부랴부랴 기술 공부를 한다(벼락치기)."
      shortcoming: "기술 면접 때만 반짝 기억나고 나의 실력(지식)이 되지 못한다."
      why_ours: "우리는 면접 직전이 아니라 프로젝트를 만든 직후에, 내가 만든 기능을 교재로 배우게 한다. 배운 것이 내 코드의 파일·라인에 붙어 있어서 휘발되지 않는다."
    - how_used: "A2. 다시 AI에게 해당 코드나 기술을 설명해 달라고 요청한다."
      shortcoming: "물어볼 당시에만 기억나고 휘발된다. 제대로 된 프롬프트를 주지 못하면 효율적인 학습이 어렵다. 논문이 말한 '재프롬프트-붙여넣기 반복'으로 이어지기 쉽다(SRC-6)."
      why_ours: "우리는 묻기 전에 먼저 기능→파일 역할→코드→개념의 전체 흐름을 그려 보여 주고, 퀴즈와 수정 미션으로 이해했는지 확인한다. 챗봇은 물어본 것만 답하고, 안 물어본 것과 이해했는지는 알려 주지 않는다."
    - how_used: "A3. 코딩 교육 플랫폼을 이용하여 기술을 공부한다."
      shortcoming: "자신의 프로젝트의 기반이 되는 기술뿐 아니라 다른 불필요한 것들도 공부해야 한다. 맞춤형 교육이 아니다."
      why_ours: "우리는 범용 강의가 아니라 사용자가 직접 만든 저장소의 실제 코드만 교재로 쓴다. 설명마다 파일 경로와 라인 범위가 붙어 있어 배운 것을 내 프로젝트에 바로 적용할 수 있다."
personas:
  - id: P1
    description: "AI 코딩 도구로 캡스톤·포트폴리오 웹앱을 완성한 SW 전공 3~4학년. 취업 면접과 캡스톤 발표를 앞두고 있다. 화면과 기능은 알지만 파일 구조·DB·API 연결은 설명하지 못한다. 논문의 '취약한 개발자'에 해당한다(SRC-6)."
    source: "종이 캔버스 ② 고객 + 팀원 본인(SUMTECH 팀, 2026-10)"
  - id: P2
    description: "신인 개발자, 또는 예전에 AI와 함께 만든 프로젝트를 다시 열어야 하는 개발자. 결과물은 돌아가지만 구조를 잊어, 기능 추가·버그 수정 때 다시 AI에 전부 맡긴다. 버그가 나면 디버깅 대신 재프롬프트한다(SRC-6, 5%)."
    source: "종이 캔버스 ② 고객"
experiences:
  - id: E1
    when: "2026년 10월, 교수님·기업 평가자·4학년 선배들과 만난 자리"
    what_happened: "선배와 기업 쪽 분들이 공통으로 'AI를 돌리는 건 좋은데 이게 어떻게 굴러가는지를 잘 모르는 상태'라고 말했다."
    workaround: "그 자리에서는 넘겼지만, 돌아와서 내 프로젝트를 다시 열어 보니 DB와 서버 연결을 말로 설명할 수 없었다."
    feeling: "대충은 아는데 면접이나 발표에서 제대로 말하지 못할 것 같다는 불안"
    quote: "AI를 돌리는 건 좋지만 이게 어떻게 굴러가는지를 잘 모르는 상태다."
    source: "팀원 본인 경험(2026-10-29 팀 대화 기록)"
  - id: E2
    when: "바이브코딩 프로젝트를 GitHub에 올린 뒤"
    what_happened: "코드는 깃허브에 있어서 작은 내용은 알겠는데, DB는 어떻게 되고 서버·배포는 어떻게 이어지는지 알 수 없었다."
    workaround: "AI에게 다시 설명을 요청했지만 물어본 부분만 알게 되고, 안 물어본 층(DB·배포)은 그대로 모른 채 남았다."
    feeling: "내가 만들었다는 성취감과, 내가 설명하지 못한다는 찜찜함이 같이 있다."
    quote: "깃허브에 올리는 거면 코드 작은 내용은 알겠지만, DB는 어찌 되고."
    source: "팀원 본인 경험(2026-10-29 팀 대화 기록)"
sources:
  - id: SRC-1
    url: "https://dorumugs.github.io/coding/%EB%B0%94%EC%9D%B4%EB%B8%8C%EC%BD%94%EB%94%A9_%EB%A9%B4%EC%A0%91_%EC%A0%84%EC%B2%B4%EA%B7%B8%EB%A6%BC_%ED%8C%90%EB%B3%84%EC%A0%84%EB%9E%B5/"
    title: "바이브 코딩하는 사람, 뭘 물어야 하나 — 면접관을 위한 전체 그림과 판별 전략 (KayserDocs)"
    claim: "면접관이 겪는 현상 — '과제를 내면 다들 깔끔하게 완성해 오는데, 물어보면 자기 코드를 설명 못 하는 사람이 섞여 있다', '산출물과 실력 사이의 연결선이 끊어졌다'"
  - id: SRC-2
    url: "https://www.krivet.re.kr/kor/sub.do?menuSn=14&pstNo=PB0000000598"
    title: "KRIVET Issue Brief 307호: AI 시대의 학습에 대한 대학생의 인식과 불안 (한국직업능력연구원, 2025-09-25)"
    claim: "2024년 1학기 기준 생성형 AI 이용 경험이 있는 4~6년제 대학 재학생 726명 조사. AI 활용이 학업 효율에 도움이 된다고 보면서도 과도한 의존과 역량 저하를 불안해함"
  - id: SRC-3
    url: "https://www.chosun.com/national/national_general/2025/11/09/H4NZNXFVJNHBXCBXXYXZFVWUZI/"
    title: "온라인 시험 중 자꾸 딴곳을… 연세대 50여명 'AI 커닝' 파문 (조선일보, 2025-11-09)"
    claim: "SRC-2 조사를 인용해 대학생 726명 중 91.7%가 과제·자료 검색에 AI 활용 경험이 있다고 보도; 전국 대학 131곳 중 71.1%는 AI 가이드라인 미비"
  - id: SRC-4
    url: "https://survey.stackoverflow.co/2025/ai"
    title: "2025 Stack Overflow Developer Survey — AI 섹션"
    claim: "개발자 66%가 'AI solutions that are almost right, but not quite'를 가장 큰 불만으로, 45%가 'Debugging AI-generated code is more time-consuming'이라고 답함"
  - id: SRC-5
    url: "https://www.anthropic.com/research/AI-assistance-coding-skills"
    title: "How AI assistance impacts the formation of coding skills (Anthropic Research, 2026)"
    claim: "개발자 52명 무작위 대조 실험. AI 도움 집단이 방금 쓴 개념 퀴즈에서 손으로 코딩한 집단보다 17% 낮은 점수(학점 두 단계 수준), 속도 이득은 유의하지 않음. 설명을 요청하는 방식으로 쓴 경우는 예외"
  - id: SRC-6
    url: "https://arxiv.org/abs/2510.00328"
    title: "Vibe Coding in Practice: Motivations, Challenges, and a Future Outlook — a Grey Literature Review (Fawzy, Tahir, Blincoe; arXiv 2510.00328, 2025-09-30)"
    claim: "실무자 출처 101개에서 바이브코딩 행동 기록 518건을 체계적으로 분석. 동기: 속도·효율 62%, 접근성 14%, 학습 11%(n=140). 경험: 즉시 성공·몰입 64%, 코드 붕괴·포기 11%(n=132). 품질 인식: '빠르지만 결함' 68%, '취약·오류 잦음' 19%(n=114). 검증 관행: 테스트 생략 36%, 확인 없는 신뢰 18%, AI에 검증 위임 10%, 디버깅 대신 재프롬프트 5%(n=132). 관련 연구 인용: CS1 학생의 LLM 코드 이해 과제 성공률 32.5%(Zi et al.). 결론: '만들 수는 있지만 고칠 수 없는' 취약한 개발자 계층의 출현, 초보 개발자 함정(재프롬프트-붙여넣기 반복). 권고: 도구에 단계별 설명(walkthrough)·시각 다이어그램·인라인 설명·안내된 디버깅 발판을 넣어 사용자가 문제를 직접 진단하게 할 것"
five_whys:
  symptom: "자신의 프로젝트에서 쓰인 기술·기능을 제대로 모른다."
  whys:
    - "AI에게 프로젝트 개발을 맡기기 때문이다. (SRC-6: 바이브코더의 가장 큰 동기는 속도 62%)"
    - "AI가 속도 면에서 더 빨리 작성하고 오류를 덜 범하기 때문이다. (SRC-6: 즉시 성공·몰입 경험 64%)"
    - "프로젝트가 작동하면 끝났다고 여기고 이해는 뒤로 미루기 때문이다. — 팀 가설. SRC-6의 '즉시 성공 경험이 정확하다는 착각을 만든다', 테스트 생략 36%·확인 없는 신뢰 18%가 뒷받침"
    - "이미 만든 내 프로젝트에 맞춰 무엇부터 배울지 알려 주는 과정이 없기 때문이다. — 팀 가설. SRC-6가 도구에 walkthrough·다이어그램·안내된 디버깅 발판을 '넣으라'고 권고한다는 것은 아직 없다는 뜻"
    - "기존 교육은 범용 문법을, AI 도구는 코드 생성만 맡아 둘 사이가 비어 있기 때문이다. — 팀 가설. SRC-6 향후 과제: '교육적 개입이 도구 설계를 보완해야 한다'"
solution_paths:
  - path: "만들어진 프로젝트 링크를 통해 역으로 프로젝트에 사용된 기능·기술들을 공부한다 (기능 중심 Top-down 역학습)"
    status: chosen
    reason: |-
      사용자가 이미 아는 화면·기능에서 시작해 실제 코드 근거(파일·라인)를 따라가고 작은 수정까지 해 보면,
      범용 강의(A3)보다 내 프로젝트에 바로 붙는 지식이 되고, 벼락치기(A1)나 그때그때 질문(A2)처럼 휘발되지 않는다.
      논문이 도구 설계자에게 권고한 네 가지(단계별 설명, 시각 다이어그램, 인라인 설명, 안내된 디버깅 발판) 중 앞의 셋을 그대로 구현하고,
      수정 미션이 '안내된 디버깅 발판' 역할을 한다(SRC-6). AI를 설명 용도로 쓸 때는 이해도 저하가 나타나지 않았다는 실험(SRC-5)과도 맞는다.
      대학생 팀이 무박 2일 안에 만들 수 있다: 공개 저장소 읽기 + LLM 설명 + 퀴즈·미션 화면이면 되고, 코드 실행이나 로그인이 필요 없다.
  - path: "일반 문법 강의 추천만 제공"
    status: deferred
    reason: "내 코드의 기능·파일·개념 연결 문제를 직접 해결하지 못한다. A3와 같은 한계."
  - path: "AI가 프로젝트 코드를 자동 수정하는 서비스"
    status: rejected
    reason: "학습보다 대리 수행을 강화해 제품 목적과 어긋난다. 논문이 경고한 'AI에 검증 위임(10%)'과 '재프롬프트-붙여넣기 반복'을 더 키운다(SRC-6)."
insight:
  claim: "바이브코딩으로 프로젝트를 완성한 학생에게 '이 기능을 누르면 어떤 파일이 어떤 순서로 실행되고 DB에 무엇이 남는지'를 물으면, 화면 설명은 해도 파일·DB 단계는 답하지 못한다."
  evidence: "팀원 본인 경험 2건(E1·E2): 선배·기업 평가자가 같은 말을 했고, 본인도 GitHub에 올린 프로젝트의 DB·서버 연결을 설명하지 못했다. 면접관의 공개 글(SRC-1)이 같은 현상을 말한다. 문헌: CS1 학생의 LLM 코드 이해 성공률 32.5%, 바이브코딩 세션의 11%가 고치지 못해 포기, 검증을 AI에 맡기거나 생략한 비율 합계 64%(SRC-6); 통제 실험에서 AI 도움 집단의 이해도 17% 낮음(SRC-5). 우리 팀이 직접 잰 횟수·비율은 아직 없다(바이브코딩 경험자 5명 내외 인터뷰 예정)."
  design_decision: "만든다 — 공개 GitHub 저장소를 넣으면 사용자가 아는 기능에서 출발해 파일 역할→실제 코드(경로·라인)→개념 순으로 설명(walkthrough + 흐름 다이어그램 + 인라인 설명)하고, 퀴즈와 작은 수정 미션(안내된 디버깅 발판)으로 이해를 확인하는 웹앱. 만들지 않는다 — 코드를 대신 고쳐 주는 기능(검증 위임을 키움), 저장소 코드를 서버에서 실행하는 기능, 범용 강의 추천, 로그인·결제. 사용자 행동 변화 — 면접 직전 벼락치기 대신 프로젝트를 만든 직후 자기 코드로 공부하고, 버그가 나면 재프롬프트하기 전에 흐름에서 위치를 먼저 찾으며, 작은 수정은 직접 한다."
features:
  - id: FR-01
    name: "공개 GitHub 저장소 가져오기"
    input: "공개 GitHub 저장소 URL(owner/repo)"
    output: "사용자가 owner/repo URL을 입력하면 기본 브랜치의 분석 가능한 파일을 수집한다."
    done: |-
      유효한 공개 저장소 URL 입력 시 저장소 이름을 표시한다.
      README·설정 파일·소스 코드 중 필요한 파일을 수집한다.
      잘못된 URL, 404, private, API rate limit은 원인을 구분한 안내를 표시한다.
  - id: FR-02
    name: "파일 필터링 및 안전한 분석 컨텍스트 생성"
    input: "소스 파일 목록"
    output: "소스 파일 목록을 만들되 생성물과 비밀정보 위험 파일을 제외한다."
    done: |-
      node_modules, .git, dist, build, .next, lockfile, 바이너리는 기본 제외한다.
      .env, 비밀키·인증서 등 민감 파일은 모델 입력으로 보내지 않는다.
      분석에 사용한 경로와 파일 내용을 실제 GitHub 응답에 근거해 기록한다.
  - id: FR-03
    name: "프로젝트 전체 구조 요약"
    input: "FR-02에서 걸러진 파일 목록과 README·package.json 등 설정 파일 내용"
    output: "앱 목적, 기술 스택, 주요 디렉터리, 화면·API 역할을 쉬운 말로 정리한다."
    done: |-
      프레임워크 추정의 근거 파일(package.json 등)을 보여준다.
      확인하지 못한 기술 요소는 '확인 불가'로 표시한다.
  - id: FR-04
    name: "기능 중심 탐색 카드"
    input: "저장소"
    output: "저장소에서 근거를 찾은 사용자 기능을 최대 5개 추출해 탐색할 수 있게 한다."
    done: |-
      가능할 경우 기능 2~5개를 제목·한 줄 설명과 함께 표시한다.
      각 기능은 근거가 되는 파일을 적어도 하나 포함한다.
      기능을 찾지 못한 경우 임의의 기능을 꾸미지 않고 지원 부족을 알린다.
  - id: FR-05
    name: "기능별 코드 흐름 시각화"
    input: "선택 기능"
    output: "선택 기능의 UI → 상태/로직 → API/데이터 등 실제로 확인된 연결을 보여준다."
    done: |-
      최소 한 개 이상의 파일 참조에 path, start_line, end_line을 제공한다.
      클릭하면 해당 파일의 코드 발췌와 라인 번호를 볼 수 있다.
      확인되지 않은 호출 관계는 확정적인 화살표로 표현하지 않는다.
  - id: FR-06
    name: "Top-down 맞춤 학습"
    input: "사용자가 고른 기능"
    output: "사용자가 고른 기능을 기준으로 전체 역할부터 실제 코드와 핵심 개념까지 설명한다."
    done: |-
      기능 설명, 파일 역할, 중요한 코드, 적용 개념의 4단계를 제공한다.
      최소 하나의 개념 설명이 해당 저장소의 실제 코드에 연결된다.
      초급 용어 풀이 및 '왜 필요한가' 설명을 포함한다.
  - id: FR-07
    name: "학습 이해도 퀴즈"
    input: "선택 기능"
    output: "선택 기능에 대해 짧은 이해도 확인 문제를 제시한다."
    done: |-
      객관식 또는 짧은 질문 1~3개를 제공한다.
      정답/오답에 관계없이 해당 코드 근거와 해설을 보여준다.
      퀴즈 결과만으로 실제 수정 능력을 보장한다고 표현하지 않는다.
  - id: FR-08
    name: "직접 수정 미션"
    input: "학습한 기능"
    output: "학습한 기능의 범위 안에서 안전하고 작은 코드 변경 과제를 제공한다."
    done: |-
      목표, 예상 수정 위치, 성공 조건, 힌트를 표시한다.
      사용자가 자신의 개발 환경에서 직접 수정하도록 안내한다.
      사용자가 수동으로 성공 여부를 체크할 수 있다.
      자동 수정·저장소 푸시는 수행하지 않는다.
  - id: FR-09
    name: "코드 변경 정적 피드백 (P1)"
    input: "사용자가 붙여 넣은 코드 조각이나 diff"
    output: "사용자가 붙여 넣은 코드 조각이나 diff를 성공 조건과 대조해 피드백한다."
    done: |-
      제출 내용을 원래 코드와 요구사항에 대조해 피드백한다.
      실제 실행·테스트를 하지 않았으므로 정답 확정 대신 추정 결과임을 표시한다.
      제출 텍스트에 비밀값이 의심되면 전송 전 경고한다.
  - id: FR-10
    name: "데모 예제 모드"
    input: "홈 화면의 '샘플로 체험하기' 클릭 (저장소 URL 입력 없음)"
    output: "GitHub 연결 실패 상황에서도 준비된 공개 샘플로 핵심 흐름을 재현한다."
    done: |-
      샘플/데모 모드임을 명확하게 표시한다.
      동일한 기능 탐색→학습→수정 미션 흐름을 확인할 수 있다.
