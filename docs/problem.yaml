statement: >-
  AI로 캡스톤·포트폴리오 웹앱을 만든 SW 전공 대학생과, 예전에 만든 프로젝트를 다시 여는 신인 개발자 중에는
  화면의 기능은 알지만 그 기능이 어느 파일에서 화면·서버·DB로 이어지는지 설명하지 못하는 사람이 있다.
  이들은 정렬 순서 같은 작은 동작을 바꾸거나 면접·발표에서 구현을 설명할 때 시작점을 찾지 못해,
  수정을 다시 AI에 맡기거나 프로젝트 전체를 처음부터 설명받는다.
  해결하려는 문제는 코드 생성의 속도가 아니라, 완성한 기능을 자기 코드의 위치·역할·개념과 연결하지 못해 직접 이해하고 수정하기 어려운 상태다.
canvas:
  context: |-
    E1에서는 해커톤 뒤 일정 관리 웹서비스의 날짜 정렬을 최신순에서 오래된 순으로 바꾸려 했다.
    화면에서 원하는 변화는 알았지만, 어느 파일을 고쳐야 하는지와 정렬이 화면 쪽인지 서버 쪽인지 몰라 직접 수정을 포기했다.
    E2에서는 6개월 전 만든 프로젝트에 기능을 추가하려고 다시 열었으나 폴더 구조·API 흐름·DB 설계 이유를 떠올리지 못했다.
    이전 AI 대화에서도 필요한 맥락을 찾기 어려워 전체 코드를 다시 설명받았다. 두 경험의 공통 장면은 작동하는 결과물이 있는데도 다음 변경을 시작하지 못하는 순간이다.
  customer: |-
    핵심 대상(P1): 공개 가능한 자기 GitHub 저장소가 있고, AI 코딩 도구로 캡스톤·포트폴리오 웹앱을 완성했지만 기능과 코드 구조를 연결해 설명하기 어려운 SW 전공 3~4학년.
    사용 계기는 완성 직후의 기능 수정, 캡스톤 발표나 취업 면접 준비다. 이 중 작은 기능을 직접 바꾸려는 상황을 대표 문제로 삼는다.
    확장 대상(P2): 예전에 AI와 함께 만든 프로젝트를 다시 열어 기능 추가·수정을 해야 하지만 구조와 구현 맥락을 잊은 신인 개발자.
    이미 구조를 이해하고 빠른 코드 생성만 원하는 사람보다, 자기 프로젝트를 교재로 이해하고 직접 수정하려는 사람을 우선한다.
  root_problem: |-
    팀 경험에서 도출한 원인 가설: 화면이 정상 동작하는 것을 완성 기준으로 삼으면, 해당 기능의 코드 위치와 동작 이유를 스스로 설명하지 못해도 작업을 끝낼 수 있다.
    나중에 배우려 해도 이미 아는 화면의 기능과 낯선 파일·기술 용어 사이의 연결을 모르므로, 읽을 코드와 학습 순서를 정하는 데서 막힌다.
    E1의 수정 위치 탐색 실패와 E2의 구현 맥락 재탐색이 이 가설의 출발점이다. 모든 바이브코딩 사용자에게 같은 원인이 있다는 뜻은 아니다.
    기존 AI와 코드 문서화 도구도 설명·구조 파악을 돕는다. 남은 검증 과제는 설명을 얻는 것과, 사용자가 관련 위치와 변경 이유를 스스로 말하고 작은 수정을 시도하는 것 사이의 간격이다.
  impact:
    feeling: "개발자라는 직업에 대한 회의감. '실제 나의 실력·기술이 되지 못한다'는 불안. 면접·발표 앞에서 '내 프로젝트인데 설명을 못 한다'는 답답함."
    measurable: |-
      팀 경험에서 확인된 손실: E1은 원하는 수정 위치를 찾지 못해 직접 수정을 포기했고, E2는 과거 프로젝트의 구조를 다시 설명받아야 했다. 소요 시간·발생 빈도는 측정하지 않았다.
      팀 밖 공개 경험담(작성자의 자기 보고이며 팀의 인터뷰·측정 결과가 아님):
      - DEV 작성자는 작은 화면 변경에서 담당 파일을 찾느라 2시간이 걸렸다고 썼다. 저자가 같은 문제를 다루는 도구를 홍보하는 글이므로 독립적인 수요 검증으로 취급하지 않는다(SRC-8).
      - Stack Overflow Blog 작성자는 오류 내용을 이해하지 못한 채 AI 도구에 메시지를 붙여 넣어 약 45분간 수정했다고 썼다. 비전공자의 사례이므로 핵심 대상인 SW 전공 학생의 빈도를 설명하는 자료가 아니라 반복 요청 행동의 보조 사례다(SRC-10).
      공개 글은 비슷한 장면이 기술되어 있다는 근거다. 진술의 사실성이나 대표성을 독립 검증한 것은 아니며, 국내 학생 대상의 직접 확인과 문제 빈도·시간 측정은 여전히 남아 있다.
      외부 근거(원문 재확인 2026-10-29):
      - Stack Overflow 2025의 AI 도구 불만 문항 응답자 31,476명 중 66%가 "거의 맞지만 완전히 맞지는 않는 결과", 45%가 "AI 생성 코드 디버깅의 추가 시간"을 선택했다. 우리 대상 대학생의 피해율이 아니라 개발자들의 불만 응답이다(SRC-4, https://survey.stackoverflow.co/2025/ai).
      - 개발자 52명이 새로운 Python 라이브러리를 배우는 실험에서 AI 도움 집단의 직후 퀴즈 평균은 50%, 비AI 집단은 67%였다. 코드 작성의 완성과 개념 습득이 다를 수 있다는 근거이며, 우리 서비스의 효과나 장기 기억을 측정한 결과는 아니다(SRC-5, https://www.anthropic.com/research/AI-assistance-coding-skills).
      검증 계획(아직 수행하지 않음, 제품 기능 추가가 아닌 팀의 수동 사용 관찰):
      - P1에 해당하는 바이브코딩 경험자 5명 내외를 모집해 최근 수정 포기·재설명 요청 장면을 확인한다. 경험이 없는 응답도 기록하며, P2가 참여하면 핵심 대상과 별도로 보고한다.
      - 관찰 전에 공개 가능한 자기 저장소에서 수정 범위·관련 파일 수·필요 개념이 유사한 서로 다른 기능의 과제 쌍을 정한다. 코드 근거와 허용 가능한 수정 위치·이유를 먼저 기록하고 결과를 본 뒤 정답 기준을 바꾸지 않는다.
      - 기존 방법과 서비스 사용을 서로 다른 과제에 배정하고 참여자별 순서를 번갈아 배정한다. 일반 AI에 같은 학습 순서를 요청하는 방법도 비교 대상으로 명시한다. 이전 과제의 학습이 영향을 줄 수 있으므로 동일 기능 반복 결과는 독립 비교와 분리한다.
      - 관찰자가 설명·정답을 가린 뒤 사용자가 관련 위치와 변경 이유를 둘 다 코드 근거에 맞게 설명하면 해당 과제를 성공으로 기록한다. 가림은 수동 관찰 절차이며 제품 UI 변경이나 새 기능이 아니다.
      - 탐색 과제는 안내가 끝난 시점부터 최종 설명 또는 포기까지 최대 10분으로 동일하게 관찰한다. 시간 초과·포기는 실패로 남기고 완료자 평균에서 누락시키지 않는다. 서비스 준비·학습 시간과 학습 후 탐색 시간을 따로 기록하고 둘을 합친 총시간도 비교한다.
      - AI에 추가 요청을 보내거나 관찰자에게 힌트를 요청할 때마다 도움 1회로 기록한다. 질문 구성 부담은 최초 질문 작성 시간과 추가 요청 횟수로 보되, 준비 시간이 다른 경우를 총시간과 함께 해석한다.
      - 주지표는 위치·이유 설명의 성공 인원/실제 참여 인원과 개인별 변화다. 시간·도움 횟수는 보조 지표다. 학습 후 설명에는 성공했지만 총시간이 늘었다면 이해 가능성과 효율을 나누어 보고하며 부담 감소라고 단정하지 않는다.
      - 탐색적 후속 검증 기준은 관찰 전에 고정한다: 참여자의 과반이 서비스 조건에서 위치·이유 설명에 성공하면 다음 검증을 진행하고, 그렇지 않으면 실패 장면을 먼저 재검토한다. 이 기준은 소규모 팀 의사결정용이며 제품 효과나 경쟁 우위를 입증하는 통계적 기준이 아니다.
      - 직접 수정 시도 여부는 별도로 기록하고, 수정했다면 본인 개발 환경의 실제 동작을 확인한다. AI 미션 점수는 실행 성공의 증거로 쓰지 않는다. 결과는 익명으로 기록하며 인과관계·장기 기억 향상은 이 관찰만으로 주장하지 않는다.
  alternatives:
    - how_used: "기술 면접이 다가올 때 부랴부랴 기술 공부를 한다(벼락치기)."
      shortcoming: "개념을 복습할 수 있지만, 공부한 개념이 자기 프로젝트의 어느 기능·파일에 쓰였는지 연결하는 작업은 별도로 해야 한다. E1처럼 당장 수정할 위치가 필요한 상황에는 면접 준비만으로 충분한지 확인해야 한다."
      why_ours: "기존 F5·F6의 기능→파일 역할→코드→개념 흐름을 통해 실제 코드에 연결해 배우고, F7·F8의 퀴즈와 수정 미션으로 적용을 시도하게 한다. 장기 기억 향상은 기대 효과이며 아직 검증한 성과가 아니다."
    - how_used: "AI에게 코드 설명을 요청하거나 DeepWiki 같은 저장소 문서화 도구로 구조를 읽고 질문한다. DeepWiki의 문서·아키텍처·소스 링크·질의응답은 공식 안내에서 확인했다(https://docs.devin.ai/work-with-devin/deepwiki, 확인일 2026-10-29)."
      shortcoming: "코드 설명과 전체 구조 제공 자체는 이미 가능한 대안이다. E1·E2에서는 읽을 코드와 질문을 정하는 부담이 남았고, SRC-10은 원리 이해 없이 재요청을 반복한 공개 사례다. 대안이 학습·퀴즈를 지원하지 않는다거나 언제나 비효율적이라고 단정하지 않는다."
      why_ours: "차별화 가설은 설명 생성 자체가 아니라, 익숙한 기능 선택에서 근거 코드 학습·퀴즈·직접 수정 미션·학습 기록까지 이어지는 고정된 학습 흐름(F4~F8·F13·F15)이다. 일반 AI에 동일한 학습 순서를 요청하는 조건도 비교하며, 기능의 독점성이 아니라 사용자의 준비·질문 구성 부담이 줄어드는지를 확인한다."
    - how_used: "코딩 교육 플랫폼을 이용하여 기술을 공부한다."
      shortcoming: "기초 개념을 체계적으로 배울 수 있지만, 강의 예제를 자기 프로젝트의 파일과 구현 방식에 대응시키는 작업은 학습자에게 남는다. 모든 강의가 불필요하거나 맞춤형 학습이 불가능하다는 뜻은 아니다."
      why_ours: "범용 강의를 대체하기보다 자기 저장소에서 이미 쓰인 기능·코드를 학습의 출발점으로 삼는다(F4~F6). 지금 수정하거나 설명해야 하는 부분부터 배우려는 사용자에게 맞으며, 기초 전반을 처음 배우려는 경우에는 기존 교육이 더 적합할 수 있다."
    - how_used: "redoCebiv 작성자는 AI 생성 코드를 기능 단위로 이해하도록 돕는 도구를 만들고 있다고 공개 글에서 소개하고 대기자 등록을 안내한다(SRC-8)."
      shortcoming: "우리와 유사한 문제·접근을 다루는 시도다. 확인한 것은 글과 소개뿐이며 현재 출시 상태, 실제 제품 흐름, 퀴즈·미션·기록 제공 여부는 검증하지 않았다. 기능 부재나 성능 열위를 주장하지 않는다."
      why_ours: "유사한 시도를 숨기거나 기능 중심 학습을 최초라고 주장하지 않는다. 우리 문서에 명시된 코드 근거·학습·퀴즈·수정 미션·기록의 연결을 실제 시연 대상으로 삼되, 상대 제품 대비 우위는 별도 비교 전까지 미확인으로 둔다."
personas:
  - id: P1
    description: "AI 코딩 도구로 캡스톤·포트폴리오 웹앱을 완성한 SW 전공 3~4학년. 취업 면접과 캡스톤 발표를 앞두고 있다. 화면과 기능은 알지만 파일 구조·DB·API 연결은 설명하지 못한다."
    source: "종이 캔버스 + 팀원A 본인"
  - id: P2
    description: "신인 개발자, 예전에 AI와 함께 만든 프로젝트를 다시 열어야 하는 개발자. 결과물은 돌아가지만 구조를 잊어, 기능 추가·버그 수정 때 다시 AI에 전부 맡긴다. 버그가 나면 디버깅 대신 재프롬프트한다"
    source: "종이 캔버스 + 팀원B 본인"
experiences:
  - id: E1
    when: 2025년 4월, 교내 무박 해커톤 종료 후 서비스 개선 작업 중
    what_happened: AI로 만든 일정 관리 웹서비스에서 날짜 정렬 방식을 변경하고 싶었다. 단순히 최신순을 오래된 순으로 바꾸는 작업이었지만 어떤 파일을 수정해야 하는지, 정렬이 프론트엔드에서 이루어지는지 서버에서 이루어지는지조차 알 수 없었다.
    workaround: 직접 코드를 수정하려다가 포기하고 AI에게 "정렬을 반대로 바꿔줘"라고 요청했다.
    feeling: 간단한 수정까지 AI에 의존해야 한다는 사실에 자존심이 상했다.
    quote: "코드가 수천 줄인데 내가 직접 고칠 수 있는 건 거의 없네."
    source: "팀원A 본인 경험"
  - id: E2
    when: 2026년 4월, 6개월 전에 AI와 함께 개발했던 웹서비스에 새로운 기능을 추가하려 한다
    what_happened: 과거 AI와 함께 완성했던 웹서비스를 다시 열었다. 당시에는 기능이 정상적으로 작동했지만, 시간이 지나자 프로젝트의 폴더 구조, API 호출 흐름, 데이터베이스 설계 이유가 기억나지 않았다. 새로운 기능을 추가하려고 해도 어떤 파일부터 확인해야 하는지 알 수 없었다. 당시 AI와 주고받은 긴 대화에도 구현 과정이 흩어져 있어 필요한 내용을 찾기 어려웠다.
    workaround: 프로젝트 전체 코드를 다시 AI에 입력하고 구조를 설명해 달라고 요청했다. 이전에 작성했던 코드를 처음부터 분석하고 이해하는 데 시간을 소비했다.
    feeling: 분명히 직접 완성했던 프로젝트인데 다시 이해하는 데 많은 시간이 필요하다는 점에서 답답함을 느꼈다. 앞으로도 프로젝트를 다시 열 때마다 같은 과정을 반복해야 할 것 같아 부담스러웠다.
    quote: "분명 몇 달 전에는 내가 만든 프로젝트였는데, 지금 다시 보니까 남이 만든 코드 같아요. 기능 하나 추가하려면 처음부터 다시 공부해야 해요."
    source: "팀원B 본인 경험"
sources:
  - id: SRC-1
    url: "https://dorumugs.github.io/coding/%EB%B0%94%EC%9D%B4%EB%B8%8C%EC%BD%94%EB%94%A9_%EB%A9%B4%EC%A0%91_%EC%A0%84%EC%B2%B4%EA%B7%B8%EB%A6%BC_%ED%8C%90%EB%B3%84%EC%A0%84%EB%9E%B5/"
    title: "바이브 코딩하는 사람, 뭘 물어야 하나 — 면접관을 위한 전체 그림과 판별 전략 (KayserDocs)"
    claim: "면접관이 겪는 현상 — '과제를 내면 다들 깔끔하게 완성해 오는데, 물어보면 자기 코드를 설명 못 하는 사람이 섞여 있다', '산출물과 실력 사이의 연결선이 끊어졌다'"
  - id: SRC-2
    url: "https://www.krivet.re.kr/kor/sub.do?menuSn=14&pstNo=PB0000000598"
    title: "KRIVET Issue Brief 307호: AI 시대의 학습에 대한 대학생의 인식과 불안 (한국직업능력연구원, 2025-09-25)"
    claim: "2024년 1학기 기준 생성형 AI 이용 경험이 있는 4~6년제 대학 재학생 726명 조사. AI 활용이 학업 효율에 도움이 된다고 보면서도 과도한 의존과 역량 저하를 불안해함"
  - id: SRC-3
    url: "https://www.chosun.com/national/national_general/2025/11/09/H4NZNXFVJNHBXCBXXYXZFVWUZI/"
    title: "온라인 시험 중 자꾸 딴곳을… 연세대 50여명 'AI 커닝' 파문 (조선일보, 2025-11-09)"
    claim: "SRC-2 조사를 인용해 대학생 726명 중 91.7%가 과제·자료 검색에 AI 활용 경험이 있다고 보도; 전국 대학 131곳 중 71.1%는 AI 가이드라인 미비"
  - id: SRC-4
    url: "https://survey.stackoverflow.co/2025/ai"
    title: "2025 Stack Overflow Developer Survey — AI 섹션"
    claim: "개발자 66%가 'AI solutions that are almost right, but not quite'를 가장 큰 불만으로, 45%가 'Debugging AI-generated code is more time-consuming'이라고 답함, AI tool frustrations에 대한 문항에서 AI가 짠 코드를 제대로 이해하는게 힘들다고 16.3%가 답함"
  - id: SRC-5
    url: "https://www.anthropic.com/research/AI-assistance-coding-skills"
    title: "How AI assistance impacts the formation of coding skills (Anthropic Research, 2026)"
    claim: "개발자 52명 무작위 대조 실험. AI 도움 집단의 직후 개념 퀴즈 평균 50%, 손으로 코딩한 집단 67%(17%포인트 차, 학점 두 단계 수준), 속도 이득은 유의하지 않음. 개념 질문·설명 요청 위주로 쓴 참가자의 점수가 높았으나 집단이 작고(2~7명) 저자들은 인과관계가 아니라고 밝힘"
  - id: SRC-6
    url: "https://arxiv.org/abs/2510.00328"
    title: "Vibe Coding in Practice: Motivations, Challenges, and a Future Outlook — a Grey Literature Review (Fawzy, Tahir, Blincoe; arXiv 2510.00328, 2025-09-30)"
    claim: "실무자 출처 101개에서 바이브코딩 행동 기록 518건을 체계적으로 분석. 동기: 속도·효율 62%, 접근성 14%, 학습 11%(n=140). 경험: 즉시 성공·몰입 64%, 코드 붕괴·포기 11%(n=132). 품질 인식: '빠르지만 결함' 68%, '취약·오류 잦음' 19%(n=114). 검증 관행: 테스트 생략 36%, 확인 없는 신뢰 18%, AI에 검증 위임 10%, 디버깅 대신 재프롬프트 5%(n=132). 관련 연구 인용: CS1 학생의 LLM 코드 이해 과제 성공률 32.5%(Zi et al.). 결론: '만들 수는 있지만 고칠 수 없는' 취약한 개발자 계층의 출현, 초보 개발자 함정(재프롬프트-붙여넣기 반복). 권고: 도구에 단계별 설명(walkthrough)·시각 다이어그램·인라인 설명·안내된 디버깅 발판을 넣어 사용자가 문제를 직접 진단하게 할 것"
  - id: SRC-8
    url: "https://dev.to/redo_c_ebiv/i-built-a-saas-in-a-weekend-heres-what-broke-first-1me1"
    title: "I built a SaaS in a weekend. Here's what broke first. (DEV Community, redoCebiv)"
    claim: "작은 화면 수정에서 담당 파일을 찾느라 2시간이 걸렸다는 작성자 자기 보고. 글에는 설명용 사례도 포함되어 있어 파일 수 등의 부가 수치를 실측으로 사용하지 않는다. 저자가 기능 단위 코드 이해 도구 redoCebiv를 개발한다고 소개하며 대기자 등록을 안내하는 홍보 이해관계가 있다. 본문 확인일 2026-10-29. 실제 제품 기능·현재 출시 여부와 경험의 사실성은 독립 검증하지 않았다."
  - id: SRC-10
    url: "https://stackoverflow.blog/2026/01/02/a-new-worst-coder-has-entered-the-chat-vibe-coding-without-code-knowledge/"
    title: "A new worst coder has entered the chat: vibe coding without code knowledge (Stack Overflow Blog, Phoebe Sajor, 2026-01-02)"
    claim: "비전공 작성자가 Bolt의 오류 메시지를 이해하지 못하고 붙여 넣기를 반복해 약 45분간 수정했다는 공개 경험담. 본문 확인일 2026-10-29. 핵심 대상인 SW 전공 학생의 직접 근거가 아닌 반복 요청 행동의 보조 사례이며 우리 팀의 측정 결과가 아니다."
five_whys:
  symptom: "E1의 작은 변경 시작 실패를 중심으로 원인을 질문한다. E2는 맥락 재탐색의 보조 경험이다. 아래는 검증된 단일 인과 사슬이 아니라 원인과 유지 조건을 구분한 가설이다."
  whys:
     - "왜 작은 변경을 시작하지 못했나? 원하는 화면 변화는 알았지만 그 동작을 담당하는 파일과 화면·서버의 역할을 찾지 못했기 때문이다(E1)."
     - "왜 기능과 담당 파일의 연결을 확보하지 못했나? 화면을 완성하는 과정에서 관련 파일의 역할을 스스로 확인하고 설명하는 과정이 생략되었을 수 있기 때문이다. E1에는 학습 과정 자체가 기록되어 있지 않으므로 확정 원인이 아닌 인터뷰로 확인할 가설이다."
     - "왜 그 연결을 나중에 복원하기도 어려운가? 필요한 단서가 여러 파일과 AI 대화에 흩어져 있어 확인할 순서를 학습자가 다시 정해야 할 수 있기 때문이다(E2의 재탐색 경험에서 도출한 가설)."
     - "왜 확인할 순서를 정하기 어려운가? 사용자가 아는 것은 화면의 기능인데 찾아야 할 정보는 파일·기술 용어·연결 관계 단위여서, 어떤 단서부터 읽을지 판단할 기준이 부족할 수 있기 때문이다(검증할 원인 가설)."
     - "왜 이런 이해의 빈칸이 완성 시점에 드러나지 않을 수 있나? 기능의 정상 동작만으로는 사용자가 관련 위치와 변경 이유를 설명할 수 있는지 확인되지 않기 때문이다(앞 단계의 직접 원인이 아니라 별도의 유지 조건 가설)."
solution_paths:
  - path: "만들어진 프로젝트 링크를 통해 역으로 프로젝트에 사용된 기능·기술들을 공부한다 (기능 중심 Top-down 역학습)"
    status: chosen
    reason: |-
      사용자가 이미 아는 화면·기능에서 시작해 실제 코드 근거(파일·라인)를 따라가고 작은 수정까지 해 보면,
      자기 프로젝트에 적용할 학습을 시작하기 쉬울 것으로 기대한다. 범용 강의나 일반 AI보다 우월하다거나 지식이 장기 유지된다는 효과는 아직 검증하지 않았다.
      논문이 도구 설계자에게 권고한 네 가지(단계별 설명, 시각 다이어그램, 인라인 설명, 안내된 디버깅 발판) 중 앞의 셋을 그대로 구현하고,
      수정 미션이 '안내된 디버깅 발판' 역할을 한다(SRC-6). AI를 개념 질문·설명 요청 위주로 쓴 참가자의 퀴즈 점수가 높았다는 관찰(SRC-5, 상관관계이며 인과는 아님)과도 방향이 같다.
      선택 근거는 공개 저장소와 기존 기능 중심 학습 흐름으로 문제에 접근할 수 있다는 점이다. 실제 완성·품질은 문서 분량이나 이 선택 이유가 아니라 별도 구현 검증으로 판단한다.
  - path: "일반 문법 강의 추천만 제공"
    status: deferred
    reason: "기초 학습에는 유용하지만 강의 추천만으로는 현재 자기 프로젝트의 기능과 파일을 대응시키는 부담이 남으므로 핵심 해법으로 선택하지 않았다."
  - path: "AI가 프로젝트 코드를 자동 수정하는 서비스"
    status: rejected
    reason: "빠른 수정이 목적이라면 유용한 대안이지만, 사용자가 자기 코드의 위치와 이유를 이해하도록 돕는 이번 제품의 목적과 달라 선택하지 않았다. 자동 수정이 언제나 학습을 해친다는 인과 주장을 뜻하지 않는다."
insight:
  claim: "E1·E2에서 도출한 통찰은 학습의 출발점을 낯선 기술 이름보다 사용자가 이미 아는 자기 프로젝트의 기능에 두는 것이다. 기능과 실제 코드 위치·역할을 연결하면 무엇부터 읽고 물어봐야 할지 정하는 부담을 줄일 수 있다는 가설이다. 목표는 AI를 쓰지 못하게 하는 것이 아니라, AI의 설명을 받은 뒤에도 사용자가 관련 위치와 변경 이유를 직접 설명하고 작은 수정을 시도하도록 돕는 것이다."
  evidence: |-
    팀 경험: E1은 정렬 방향이라는 목표를 알면서도 수정 위치와 실행되는 층을 찾지 못했고, E2는 6개월 전 프로젝트의 폴더·API·DB 맥락을 복원하지 못해 전체 코드를 다시 설명받았다. 두 경험은 기능과 구현 사이의 연결 문제를 보여 주지만, 대상 전체의 빈도나 원인을 확정하는 표본은 아니다.
    팀 밖 경험: 담당 파일 탐색에 막혔다는 SRC-8과, 오류 원리를 이해하기보다 AI에 반복 요청했다는 SRC-10을 보조 근거로 사용한다. 공개 글의 자기 보고이며 해외 사례·홍보 이해관계·핵심 대상과의 차이는 sources와 canvas.impact.measurable에 명시했다. 이번 확인에서 본문을 확보하지 못한 첨부의 Reddit 사례들은 채택하지 않았다.
    외부 근거: SRC-4는 AI 생성 코드의 정확성·디버깅 부담을, SRC-5는 AI로 과제를 완성하는 것과 직후 개념 습득이 다를 수 있음을 뒷받침한다. 수치·모집단·원문 URL·확인일은 canvas.impact.measurable에 구분했다. 이 자료들이 우리 서비스의 효과를 입증하는 것은 아니다.
    기존 기능과의 연결: E1의 위치 탐색에는 F11, 역할·연결 파악에는 F5·F6이 대응한다. E2의 재탐색에는 F12·F13이 대응한다. F7·F8은 읽은 설명을 적용해 보는 단계이며, 퀴즈 정답이나 실행하지 않은 AI 점수를 실제 수정 능력의 증명으로 해석하지 않는다.
    검증 상태: 팀 자체 소요 시간·반복 빈도·학습 전후 성과는 아직 측정하지 않았다. 다음 판단은 canvas.impact.measurable의 수동 관찰 계획에 따라 위치와 이유를 스스로 찾는지, 직접 수정에 착수하는지 확인한 뒤 내린다. 장기 기억에 관한 선택 해법의 기대는 검증된 성과와 구분한다.
  design_decision: "만든다 — 공개 GitHub 저장소를 넣으면 ① 프로젝트에 쓰인 기술과 기능을 목록으로 보여 주고, 사용자가 아는 기능에서 출발해 그 기능이 화면·서버·DB의 어느 파일·라인에서 동작하는지 흐름으로 보여 주고(F4·F14·F15·F5, E1·E2), ② 기능→파일 역할→코드→개념 순서로 설명하면서 '왜 이렇게 구현했는지'를 코드 근거와 함께 풀어 주고(F6, E2·SRC-1), ③ 바꾸고 싶은 동작을 문장으로 넣으면 고칠 위치를 찾아 주되 코드를 대신 고치지는 않으며(F11, E1), ④ 퀴즈와 작은 수정 미션으로 이해를 확인하고(F7·F8, SRC-6의 안내된 디버깅 발판), ⑤ 분석 결과를 학습 노트로 내려받아 몇 달 뒤 다시 열 때 처음부터 다시 읽지 않게 하고(F12, E2), ⑥ 로그인한 사용자의 분석한 저장소·퀴즈 결과·미션 점수를 '내 학습 기록'에 남겨 다시 분석하지 않고 이어서 볼 수 있게 한다(F10·F13, E2). 만들지 않는다 — 코드 자동 수정·저장소 푸시(SRC-6의 검증 위임을 키움), 저장소 코드 실행, 결제."
features:
  - id: F1
    name: "공개 GitHub 저장소 연결"
    input: "로그인한 사용자가 홈의 'GitHub 프로젝트 분석하기'에서 입력한 공개 GitHub 저장소 URL(https://github.com/owner/repo)"
    output: "저장소 이름·기본 브랜치·분석 기준 commit SHA가 화면에 표시되고, 이 commit 기준으로 분석 결과가 저장된다."
    done: |-
      공개 저장소 URL을 넣고 '분석 시작'을 누르면 저장소 이름·기본 브랜치·commit SHA가 보인다.
      잘못된 URL, 찾을 수 없는 저장소(없거나 비공개), GitHub 요청 한도 초과는 각각 다른 안내 문구를 보여 주고 결과 화면으로 넘어가지 않는다.
      빈 저장소, GitHub 장애, AI 응답 지연·실패도 각각 안내 문구를 보여 주고, 다시 시도하면 나아질 수 있는 오류에는 '다시 시도' 버튼이 보인다.
      이미 분석한 저장소의 최신 commit이 그대로면 AI를 다시 부르지 않고 저장된 분석 결과를 보여 준다.
  - id: F2
    name: "분석 제외 파일 처리"
    input: "F1에서 연결한 저장소 (사용자가 따로 넣는 것 없음)"
    output: "분석에 쓴 파일 수와 제외한 파일 수가 분석 결과 화면에 표시된다."
    done: |-
      node_modules, .git, dist, build, .next, lockfile, 바이너리 파일은 분석 파일 목록에 나오지 않는다.
      .env, 비밀키·인증서 파일은 AI 입력에 들어가지 않고 '민감 파일 제외' 개수로만 표시된다.
      화면에 나오는 모든 파일 경로는 분석 기준 commit에 실제로 있는 경로다.
  - id: F3
    name: "프로젝트 소개"
    input: "F1에서 연결한 저장소 (분석이 끝나면 자동)"
    output: "분석 결과 화면 맨 위에 프로젝트 한 줄 소개, 기술 스택 한 줄 요약(기술 이름만), 주요 폴더와 각 폴더의 역할(화면·서버·DB·설정)이 표시된다. 기술마다의 역할과 근거는 F4에서 보여 준다."
    done: |-
      소개 아래에 근거로 쓴 파일 경로(README 등)가 보인다. README가 없어 코드로만 추정한 소개는 근거 파일 대신 'AI 추정'으로 표시되고, 근거를 찾지 못하면 '확인 불가'로 표시된다.
      기술 스택 요약에는 F4 '사용한 기술'에 있는 기술 이름만 나온다.
      주요 폴더마다 폴더 경로와 화면·서버·DB·설정 중 하나의 역할이 보이고, 판단 근거를 찾지 못한 폴더는 '확인 불가'로 표시된다.
  - id: F4
    name: "사용한 기술·기능 목록"
    input: "F1에서 연결한 저장소 (분석이 끝나면 자동)"
    output: "분석 결과 화면에 '사용한 기술'과 '기능' 두 구역이 표시된다. '사용한 기술'에는 기술마다 이름·근거 파일 경로·이 프로젝트에서 맡은 역할이, '기능'에는 사용자가 화면에서 쓰는 기능 2~5개의 제목·한 줄 설명·근거 파일 경로가 보인다."
    done: |-
      '사용한 기술'에는 기술이 1개 이상, '기능'에는 기능이 2~5개 보인다.
      기술·기능 항목마다 분석 기준 commit에 실제로 있는 근거 파일 경로(package.json 등)가 1개 이상 보인다.
      항목을 누르면 기술은 기술 상세(F14), 기능은 기능 상세(F15)로 이동한다.
      기능을 찾지 못하면 꾸며 내지 않고 '기능을 찾지 못했습니다'를 보여 주고 '사용한 기술' 구역만 보여 준다.
  - id: F5
    name: "기능 동작 흐름(화면→서버→DB)"
    input: "기능 상세(F15)에서 '이 기능 어떻게 동작해?' 클릭"
    output: "선택한 기능이 화면 → 상태·로직 → 서버/API → DB 순서로 어느 파일에서 동작하는지 단계별 파일 카드로 표시된다."
    done: |-
      흐름 위쪽에 화면·상태/로직·서버/API·DB마다 몇 번째 단계인지 요약이 보인다.
      단계마다 파일 경로, 시작·끝 라인, 코드 발췌가 보이고 '다음 단계'로 다음 파일 카드가, '이전 단계'로 앞 카드가 열린다. 마지막 단계에서는 '이 코드의 개념 배우기' 버튼이 보인다.
      저장소에 서버·DB 코드(API 라우트, 스키마, 쿼리)가 있으면 그 단계 카드가 흐름에 포함된다. 없으면 '이 저장소에서 확인되지 않음'으로 표시한다.
      코드에서 확인하지 못한 연결은 'AI 추정'으로 구분해 표시하고 확정된 연결처럼 그리지 않는다.
  - id: F6
    name: "Top-down 학습과 '왜 이렇게 만들었나'"
    input: "기능 상세(F15)에서 '이 코드 배우기' 클릭, 필요하면 '쉬운 설명 펼치기' 클릭"
    output: "기능 설명, 파일 역할, 중요한 코드, 핵심 개념의 4개 섹션과 '왜 이렇게 만들었나'(이 구현 방식을 쓴 이유) 설명이 표시된다."
    done: |-
      핵심 개념마다 그 개념이 쓰인 파일 경로와 라인 범위가 붙어 있다.
      '쉬운 설명 펼치기'를 누르면 용어 풀이와 '왜 필요한가' 설명이 펼쳐진다.
      '왜 이렇게 만들었나'는 근거 코드 위치와 함께 보이고, 코드로 확인할 수 없는 이유는 'AI 추정'으로 표시된다.
  - id: F7
    name: "이해도 퀴즈"
    input: "'이해도 확인' 클릭 후 보기 선택, '정답 확인' 클릭"
    output: "정답 여부, 그 이유, 참고할 코드 위치(파일 경로·라인)가 표시된다."
    done: |-
      선택한 기능의 코드에 관한 질문이 1~3개 나온다.
      정답·오답 모두 이유와 코드 위치가 보인다.
      퀴즈 결과로 실제 수정 능력을 보장한다는 문구는 쓰지 않는다.
      문항별 첫 '정답 확인' 결과가 '내 학습 기록'에 저장된다(F13).
  - id: F8
    name: "직접 수정 미션"
    input: "'이제 네가 직접 바꿔봐' 클릭, 내 개발 환경에서 고친 코드를 '고친 코드' 입력란에 붙여 넣고 '채점하기' 클릭"
    output: "변경 목표, 예상 수정 파일·라인, '현재 코드 → 목표' 비교, 힌트, 채점 기준(성공 조건)이 표시되고, 채점하면 0~100점 점수와 피드백·다음 힌트가 표시된다. 통과·실패나 조건별 충족 여부는 표시하지 않는다."
    done: |-
      힌트는 처음에 하나만 보이고 '다음 힌트 보기'를 누를 때마다 하나씩 더 열린다.
      한 번 채점한 뒤에는 '다시 채점하기'로 고친 코드를 다시 채점받을 수 있다.
      코드를 붙여 넣어야 '채점하기'를 누를 수 있고, 로그인해야 채점할 수 있다.
      점수는 AI가 코드를 읽고 성공 조건을 채운 비율로 매긴 추정치이며, 코드를 실행하지 않았다는 문구가 함께 보인다.
      비밀값으로 보이는 문자열이 있으면 AI로 보내지 않고 지우라고 안내한다.
      서비스가 코드를 자동 수정하거나 저장소에 푸시하지 않는다.
      점수는 '내 학습 기록'에 저장된다(F13).
  - id: F9
    name: "코드 변경 피드백 (F8 채점에 합침)"
    input: "F8의 '고친 코드' 입력란에 붙여 넣은 코드"
    output: "따로 화면을 두지 않고, F8 채점 결과의 피드백과 다음 힌트로 보여 준다."
    done: |-
      기능 번호만 남겨 두고, 동작과 완료 조건은 F8을 따른다.
      실행하지 않은 추정 결과라는 문구와 비밀값 차단도 F8과 같다.
  - id: F10
    name: "회원가입·로그인"
    input: "회원가입 화면에서 이름·이메일·비밀번호(8자 이상) 입력 후 '회원가입' 클릭, 또는 로그인 화면에서 이메일·비밀번호 입력 후 '로그인' 클릭"
    output: "계정이 만들어지거나 로그인되어 홈으로 이동하고, 홈 오른쪽 위에 '<이름>님'과 '로그아웃'이 표시된다."
    done: |-
      이름이 비었거나 이메일 형식이 틀리거나 비밀번호가 8자 미만이면 해당 입력란 아래에 이유가 보이고 계정이 만들어지지 않는다.
      회원가입하면 바로 로그인 상태가 된다. 이미 가입한 이메일, 틀린 비밀번호는 각각 다른 안내 문구를 보여 주고 로그인되지 않는다.
      비밀번호는 해시로만 저장하고, 로그인 유지는 httpOnly 쿠키의 세션으로 한다. '로그아웃'을 누르면 세션이 삭제된다.
      docker-compose.yml의 시드 계정(SEED_USER_EMAIL·SEED_USER_PASSWORD)으로 빈 DB에서도 바로 로그인된다.
      로그인하지 않고 분석 결과 화면이나 '내 학습 기록'을 열면 로그인 화면으로 이동하고, 로그인이 필요한 요청에는 '로그인하기' 버튼이 보인다.
  - id: F11
    name: "고칠 위치 찾기"
    input: "분석 결과 화면의 '어디를 고쳐야 해?' 입력란에 바꾸고 싶은 동작을 문장으로 입력하고 '위치 찾기' 클릭 (입력란 아래에 이 저장소에 맞는 예시 문장이 보이고, 누르면 입력란에 들어감)"
    output: "고쳐야 할 파일 경로·라인 목록이 표시되고, 위치마다 화면·서버·DB 중 어디인지와 그곳을 고치면 되는 이유, 그리고 원래 코드에서 바꿔야 하는 줄이 하이라이트된 코드 발췌가 함께 보인다."
    done: |-
      결과의 파일 경로·라인은 분석 기준 commit에 실제로 있는 위치다.
      위치마다 '화면'·'서버'·'DB' 중 하나가 표시된다.
      원래 코드 발췌에서 바꿔야 하는 줄만 하이라이트하고, 수정된 코드나 붙여 넣을 코드는 보여 주지 않는다.
      관련 위치를 찾지 못하면 '입력한 문장과 맞는 위치를 찾지 못했어요.'와 함께 '이 기능부터 살펴보세요:' 아래에 기능 버튼이 보이고, 누르면 그 기능 상세(F15)로 이동한다.
  - id: F12
    name: "학습 노트 내려받기"
    input: "분석 결과 화면의 '학습 노트 내려받기' 클릭"
    output: "프로젝트 이름, 저장소 주소·기본 브랜치, 분석 기준 commit SHA, 분석한 파일 수, 프로젝트 소개, 사용한 기술(역할·핵심 개념·쓰인 파일과 라인), 폴더 역할, 기능별 근거 파일 경로와 학습한 기능의 배운 내용이 담긴 PDF 파일이 내려받아진다."
    done: |-
      내려받은 파일 안의 commit SHA와 파일 경로가 화면에 보인 값과 같고, 경로·라인이 이 commit 기준이라는 안내 문구가 들어 있다.
      '내 학습 기록'에서 다시 연 저장소에서도 분석을 다시 하지 않고 같은 내용으로 내려받을 수 있다.
  - id: F13
    name: "내 학습 기록"
    input: "로그인한 사용자가 화면 위쪽의 '내 학습 기록' 클릭, 목록에서 저장소의 '분석 결과 보기' 클릭"
    output: "내가 분석한 저장소 목록(저장소 이름·분석 날짜·분석 기준 commit SHA)과 저장소별 퀴즈 결과(문항별 첫 시도 기준 맞힌 수/푼 문항 수), 기능별 수정 미션 점수(최고 점수)가 표시된다."
    done: |-
      로그아웃 후 다시 로그인해도 같은 목록과 결과가 보인다.
      목록 위쪽에 분석한 저장소 수, 퀴즈 정답 수, 미션 점수 평균(채점한 기능의 최고 점수 평균)이 요약으로 보인다.
      아직 풀지 않은 퀴즈는 '퀴즈 전', 채점하지 않은 미션은 '미션 전'으로 표시된다.
      '분석 결과 보기'를 누르면 분석을 다시 하지 않고 그 commit 기준 분석 결과 화면이 열린다.
      다른 사용자의 저장소·퀴즈·미션 기록은 보이지 않는다.
  - id: F14
    name: "기술 상세"
    input: "F4 '사용한 기술' 목록에서 기술 클릭"
    output: "기술 상세 화면에 그 기술의 이름, 이 프로젝트에서 맡은 역할, 핵심 개념 설명, 그 기술이 쓰인 파일 경로·라인과 코드 발췌가 표시된다."
    done: |-
      그 기술이 쓰인 위치가 보이고, 모두 분석 기준 commit에 실제로 있는 파일 경로·라인이다. 쓰인 위치를 확인하지 못하면 '이 기술이 쓰인 코드 위치를 확인하지 못했어요.'가 보인다.
      핵심 개념 설명은 이 프로젝트 코드에서 그 기술이 쓰인 위치와 함께 보인다.
      코드로 확인하지 못한 역할 설명은 'AI 추정'으로 표시된다.
  - id: F15
    name: "기능 상세"
    input: "F4 '기능' 목록에서 기능 클릭"
    output: "기능 상세 화면에 그 기능의 제목·한 줄 설명·근거 파일 경로와 '이 기능 어떻게 동작해?'(F5)·'이 코드 배우기'(F6)·'이해도 확인'(F7)·'이제 네가 직접 바꿔봐'(F8) 버튼이 표시된다."
    done: |-
      근거 파일 경로는 분석 기준 commit에 실제로 있는 경로다.
      '이 기능 어떻게 동작해?'는 처음 시작하는 큰 버튼으로, 나머지 세 버튼은 '바로 가기'로 함께 보이고, 누르면 각각 F5·F6·F7·F8 화면으로 이동한다.
      왼쪽 메뉴에 흐름·학습·퀴즈·미션 중 이 기능에서 마친 단계가 표시된다.
