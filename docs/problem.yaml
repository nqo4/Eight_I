statement: >-
  바이브코딩으로 프로젝트를 완성한 개발 지망 대학생과 개발자는 기능을 고치거나
  면접·발표에서 설명해야 하는 순간에 자기 프로젝트에 쓰인 기술과 기능이 어떻게 굴러가는지 모른다는 것을 알게 되고,
  다시 AI에 기대거나 벼락치기로 넘기기 때문에 "만들 수는 있지만 고칠 수는 없는" 상태가 계속되고 그 지식이 자기 실력으로 남지 않는다.
canvas:
  context: |-
    바이브 코딩으로 프로젝트를 진행해 개발자가 자신의 프로젝트에 사용된 기술, 기능들을 모를 때 발생함.
  customer: |-
    AI 코딩 도구(Cursor·Claude Code 등)로 캡스톤·포트폴리오를 만들고 취업 면접을 앞둔 SW 전공자
    AI와 함께 만든 프로젝트를 몇 달 뒤 다시 열어 기능을 추가, 수정해야하는 개발자
  root_problem: |-
    AI에 너무 의존하고 기술 이해보다 빠른 완성에 집중하기 때문이다. 바이브코더의 가장 큰 동기는 개발 속도이고,
    그 결과 코드 작성뿐 아니라 검증까지 AI에 맡기는 재프롬프트-붙여넣기 반복(초보 개발자 함정)에 갇혀 의도와 구현의 연결이 끊긴다.
    아직 아무도 고치지 못한 이유: 기술을 알지 못하더라도 AI를 통해 사용 가능한 서비스를 빠르게 만들 수 있기 때문
  impact:
    feeling: "개발자라는 직업에 대한 회의감. '실제 나의 실력·기술이 되지 못한다'는 불안. 면접·발표 앞에서 '내 프로젝트인데 설명을 못 한다'는 답답함."
    measurable: |-
      외부 데이터(sources 참조):
      - CS1 학생이 LLM이 만든 코드를 이해하는 과제의 성공률은 32.5%에 그쳤다 (SRC-6이 인용한 Zi et al.).
      - 바이브코딩 경험 기록 132건 중 11%는 코드 붕괴·포기로 끝났고, 품질 인식 114건 중 68%는 "빠르지만 결함 있음", 19%는 "취약하거나 오류가 잦음"이었다 (SRC-6).
      - 검증 관행 132건 중 36%는 테스트 생략, 18%는 확인 없는 신뢰, 10%는 AI에 검증 위임, 5%는 디버깅 대신 재프롬프트 (SRC-6).
      - 개발자의 66%가 "AI 결과가 거의 맞지만 완전히 맞지는 않다"를 가장 큰 불만으로, 45%가 "AI가 만든 코드를 디버깅하는 데 시간이 더 든다"고 답했다 (SRC-4, Stack Overflow 2025).
      - 무작위 대조 실험(개발자 52명)에서 AI 도움을 받아 코딩한 집단은 방금 쓴 개념 퀴즈에서 평균 50%로, 손으로 코딩한 집단(67%)보다 17%포인트 낮았고, 속도 이득은 유의하지 않았다 (SRC-5, Anthropic).
      - 생성형 AI를 써 본 4~6년제 대학생 726명 조사에서 91.7%가 과제·자료 검색에 AI를 활용했다 (SRC-2·SRC-3, 한국직업능력연구원).
  alternatives:
    - how_used: "기술 면접이 다가올 때 부랴부랴 기술 공부를 한다(벼락치기)."
      shortcoming: "기술 면접 때만 반짝 기억나고 나의 실력(지식)이 되지 못한다."
      why_ours: "우리는 면접 직전이 아니라 프로젝트를 만든 직후에, 내가 만든 기능을 교재로 배우게 한다. 배운 것이 내 코드의 파일·라인에 붙어 있어서 휘발되지 않는다."
    - how_used: "다시 AI에게 해당 코드나 기술을 설명해 달라고 요청한다."
      shortcoming: "물어볼 당시에만 기억나고 휘발된다. 제대로 된 프롬프트를 주지 못하면 효율적인 학습이 어렵다. 논문이 말한 '재프롬프트-붙여넣기 반복'으로 이어지기 쉽다(SRC-6)."
      why_ours: "우리는 묻기 전에 먼저 기능→파일 역할→코드→개념의 전체 흐름을 그려 보여 주고, 퀴즈와 수정 미션으로 이해했는지 확인한다. 챗봇은 물어본 것만 답하고, 안 물어본 것과 이해했는지는 알려 주지 않는다."
    - how_used: "코딩 교육 플랫폼을 이용하여 기술을 공부한다."
      shortcoming: "자신의 프로젝트의 기반이 되는 기술뿐 아니라 다른 불필요한 것들도 공부해야 한다. 맞춤형 교육이 아니다."
      why_ours: "우리는 범용 강의가 아니라 사용자가 직접 만든 저장소의 실제 코드만 교재로 쓴다. 설명마다 파일 경로와 라인 범위가 붙어 있어 배운 것을 내 프로젝트에 바로 적용할 수 있다."
personas:
  - id: P1
    description: "AI 코딩 도구로 캡스톤·포트폴리오 웹앱을 완성한 SW 전공 3~4학년. 취업 면접과 캡스톤 발표를 앞두고 있다. 화면과 기능은 알지만 파일 구조·DB·API 연결은 설명하지 못한다."
    source: "종이 캔버스 + 팀원 본인(SUMTECH 팀, 2026-10)"
  - id: P2
    description: "예전에 AI와 함께 만든 프로젝트를 다시 열어야 하는 개발자. 결과물은 돌아가지만 구조를 잊어, 기능 추가·버그 수정 때 다시 AI에 전부 맡긴다. 버그가 나면 디버깅 대신 재프롬프트한다"
    source: "종이 캔버스"
experiences:
  - id: E1
    when: 2025년 4월, 교내 무박 해커톤 종료 후 서비스 개선 작업 중
    what_happened: AI로 만든 일정 관리 웹서비스에서 날짜 정렬 방식을 변경하고 싶었다. 단순히 최신순을 오래된 순으로 바꾸는 작업이었지만 어떤 파일을 수정해야 하는지, 정렬이 프론트엔드에서 이루어지는지 서버에서 이루어지는지조차 알 수 없었다.
    workaround: 직접 코드를 수정하려다가 포기하고 AI에게 "정렬을 반대로 바꿔줘"라고 요청했다.
    feeling: 간단한 수정까지 AI에 의존해야 한다는 사실에 자존심이 상했다.
    quote: "코드가 수천 줄인데 내가 직접 고칠 수 있는 건 거의 없네."
    source: "SW 전공 팀원A 본인 경험"
  - id: E2
    when: 2026년 4월, 3개월 전에 AI와 함께 개발했던 웹서비스에 새로운 기능을 추가하려는 개발자
    what_happened: 과거 AI와 함께 완성했던 웹서비스를 다시 열었다. 당시에는 기능이 정상적으로 작동했지만, 시간이 지나자 프로젝트의 폴더 구조, API 호출 흐름, 데이터베이스 설계 이유가 기억나지 않았다. 새로운 기능을 추가하려고 해도 어떤 파일부터 확인해야 하는지 알 수 없었다. 당시 AI와 주고받은 긴 대화에도 구현 과정이 흩어져 있어 필요한 내용을 찾기 어려웠다.
    workaround: 프로젝트 전체 코드를 다시 AI에 입력하고 구조를 설명해 달라고 요청했다. 이전에 작성했던 코드를 처음부터 분석하고 이해하는 데 시간을 소비했다.
    feeling: 분명히 직접 완성했던 프로젝트인데 다시 이해하는 데 많은 시간이 필요하다는 점에서 답답함을 느꼈다. 앞으로도 프로젝트를 다시 열 때마다 같은 과정을 반복해야 할 것 같아 부담스러웠다.
    quote: "분명 몇 달 전에는 내가 만든 프로젝트였는데, 지금 다시 보니까 남이 만든 코드 같아요. 기능 하나 추가하려면 처음부터 다시 공부해야 해요."
    source: "예전 프로젝트를 다시 확인해야 했던 팀원B 본인 경험"
sources:
  - id: SRC-1
    url: "https://dorumugs.github.io/coding/%EB%B0%94%EC%9D%B4%EB%B8%8C%EC%BD%94%EB%94%A9_%EB%A9%B4%EC%A0%91_%EC%A0%84%EC%B2%B4%EA%B7%B8%EB%A6%BC_%ED%8C%90%EB%B3%84%EC%A0%84%EB%9E%B5/"
    title: "바이브 코딩하는 사람, 뭘 물어야 하나 — 면접관을 위한 전체 그림과 판별 전략 (KayserDocs)"
    claim: "면접관이 겪는 현상 — '과제를 내면 다들 깔끔하게 완성해 오는데, 물어보면 자기 코드를 설명 못 하는 사람이 섞여 있다', '산출물과 실력 사이의 연결선이 끊어졌다'"
  - id: SRC-2
    url: "https://www.krivet.re.kr/kor/sub.do?menuSn=14&pstNo=PB0000000598"
    title: "KRIVET Issue Brief 307호: AI 시대의 학습에 대한 대학생의 인식과 불안 (한국직업능력연구원, 2025-09-25)"
    claim: "2024년 1학기 기준 생성형 AI 이용 경험이 있는 4~6년제 대학 재학생 726명 조사. AI 활용이 학업 효율에 도움이 된다고 보면서도 과도한 의존과 역량 저하를 불안해함"
  - id: SRC-3
    url: "https://www.chosun.com/national/national_general/2025/11/09/H4NZNXFVJNHBXCBXXYXZFVWUZI/"
    title: "온라인 시험 중 자꾸 딴곳을… 연세대 50여명 'AI 커닝' 파문 (조선일보, 2025-11-09)"
    claim: "SRC-2 조사를 인용해 대학생 726명 중 91.7%가 과제·자료 검색에 AI 활용 경험이 있다고 보도; 전국 대학 131곳 중 71.1%는 AI 가이드라인 미비"
  - id: SRC-4
    url: "https://survey.stackoverflow.co/2025/ai"
    title: "2025 Stack Overflow Developer Survey — AI 섹션"
    claim: "개발자 66%가 'AI solutions that are almost right, but not quite'를 가장 큰 불만으로, 45%가 'Debugging AI-generated code is more time-consuming'이라고 답함, AI tool frustrations에 대한 문항에서 AI가 짠 코드를 제대로 이해하는게 힘들다고 16.3%가 답함"
  - id: SRC-5
    url: "https://www.anthropic.com/research/AI-assistance-coding-skills"
    title: "How AI assistance impacts the formation of coding skills (Anthropic Research, 2026)"
    claim: "개발자 52명 무작위 대조 실험. AI 도움 집단의 직후 개념 퀴즈 평균 50%, 손으로 코딩한 집단 67%(17%포인트 차, 학점 두 단계 수준), 속도 이득은 유의하지 않음. 개념 질문·설명 요청 위주로 쓴 참가자의 점수가 높았으나 집단이 작고(2~7명) 저자들은 인과관계가 아니라고 밝힘"
  - id: SRC-6
    url: "https://arxiv.org/abs/2510.00328"
    title: "Vibe Coding in Practice: Motivations, Challenges, and a Future Outlook — a Grey Literature Review (Fawzy, Tahir, Blincoe; arXiv 2510.00328, 2025-09-30)"
    claim: "실무자 출처 101개에서 바이브코딩 행동 기록 518건을 체계적으로 분석. 동기: 속도·효율 62%, 접근성 14%, 학습 11%(n=140). 경험: 즉시 성공·몰입 64%, 코드 붕괴·포기 11%(n=132). 품질 인식: '빠르지만 결함' 68%, '취약·오류 잦음' 19%(n=114). 검증 관행: 테스트 생략 36%, 확인 없는 신뢰 18%, AI에 검증 위임 10%, 디버깅 대신 재프롬프트 5%(n=132). 관련 연구 인용: CS1 학생의 LLM 코드 이해 과제 성공률 32.5%(Zi et al.). 결론: '만들 수는 있지만 고칠 수 없는' 취약한 개발자 계층의 출현, 초보 개발자 함정(재프롬프트-붙여넣기 반복). 권고: 도구에 단계별 설명(walkthrough)·시각 다이어그램·인라인 설명·안내된 디버깅 발판을 넣어 사용자가 문제를 직접 진단하게 할 것"
five_whys:
  symptom: "자신의 프로젝트에서 쓰인 기술·기능을 제대로 모른다."
  whys:
     - "AI가 생성한 코드를 충분히 이해하지 않은 채 프로젝트에 적용하기 때문이다."
     - "코드의 작동 원리를 학습하고 검증하기보다 AI를 활용해 기능을 빠르게 구현하는 데 집중하기 때문이다."
     - "프로젝트를 완성하는 데 필요한 기능 구현에 집중하느라, 구현 과정에서 사용된 기술을 학습하는 것은 후순위로 밀리기 때문이다."
     - "프로젝트를 완성한 후에도 사용된 기술을 이해하려고 하면 무엇을 어떤 순서로 학습해야 할지 판단하기 어렵기 때문이다."
     - "완성된 프로젝트의 코드와 기능을 바탕으로 필요한 개념을 찾아 학습하고 이해도를 확인할 수 있는 체계적인 과정이 부족하기 때문이다."
solution_paths:
  - path: "만들어진 프로젝트 링크를 통해 역으로 프로젝트에 사용된 기능·기술들을 공부한다 (기능 중심 Top-down 역학습)"
    status: chosen
    reason: |-
      사용자가 이미 아는 화면·기능에서 시작해 실제 코드 근거(파일·라인)를 따라가고 작은 수정까지 해 보면,
      코딩 교육 플랫폼의 범용 강의보다 내 프로젝트에 바로 붙는 지식이 되고, 면접 직전 벼락치기나 그때그때 AI에게 묻는 방식처럼 휘발되지 않는다.
      논문이 도구 설계자에게 권고한 네 가지(단계별 설명, 시각 다이어그램, 인라인 설명, 안내된 디버깅 발판) 중 앞의 셋을 그대로 구현하고,
      수정 미션이 '안내된 디버깅 발판' 역할을 한다(SRC-6). AI를 개념 질문·설명 요청 위주로 쓴 참가자의 퀴즈 점수가 높았다는 관찰(SRC-5, 상관관계이며 인과는 아님)과도 방향이 같다.
      대학생 팀이 무박 2일 안에 만들 수 있다: 공개 저장소 읽기 + LLM 설명 + 퀴즈·미션 화면이면 되기 때문
  - path: "일반 문법 강의 추천만 제공"
    status: deferred
    reason: "내 코드의 기능·파일·개념 연결 문제를 직접 해결하지 못한다. 코딩 교육 플랫폼과 같은 한계."
  - path: "AI가 프로젝트 코드를 자동 수정하는 서비스"
    status: rejected
    reason: "학습보다 대리 수행을 강화해 제품 목적과 어긋난다. 논문이 경고한 'AI에 검증 위임(10%)'과 '재프롬프트-붙여넣기 반복'을 더 키운다(SRC-6)."
insight:
  claim: "바이브코딩으로 프로젝트를 만든 학생·전공자는 '이 기능을 바꾸려면 어느 파일을 봐야 하는지, 그 코드가 화면·서버·DB 중 어디에서 동작하는지, AI가 왜 이렇게 구현했는지'를 설명하지 못한다. 그래서 정렬 순서 변경 같은 간단한 수정도 AI에 다시 맡기고, 몇 달 뒤 다시 열면 자기 프로젝트를 남의 코드처럼 처음부터 다시 읽는다."
  evidence: "E1: 해커톤 뒤 일정 관리 서비스의 날짜 정렬을 바꾸려 했지만 어느 파일인지, 정렬이 프론트엔드인지 서버인지조차 몰라 직접 수정을 포기하고 AI에 맡겼다. E2: 3개월 전 AI와 만든 서비스를 다시 열었을 때 폴더 구조·API 호출 흐름·DB 설계 이유가 기억나지 않았고, AI와의 대화 기록도 흩어져 있어 전체 코드를 AI에 다시 넣고 설명을 받았다. 면접관의 공개 글(SRC-1)도 '완성해 오지만 자기 코드를 설명하지 못한다'는 같은 현상을 말한다. 문헌: CS1 학생의 LLM 코드 이해 과제 성공률 32.5%(SRC-6이 인용한 Zi et al.), 바이브코딩 경험 기록 중 코드 붕괴·포기 11%, 디버깅 대신 재프롬프트 5%(SRC-6); AI 도움 집단의 직후 개념 퀴즈 평균 50% 대 손코딩 67%(SRC-5). 우리 팀이 직접 잰 횟수·비율은 아직 없다(바이브코딩 경험자 5명 내외 인터뷰 예정)."
  design_decision: "만든다 — 공개 GitHub 저장소를 넣으면 ① 프로젝트에 쓰인 기술과 기능을 목록으로 보여 주고, 사용자가 아는 기능에서 출발해 그 기능이 화면·서버·DB의 어느 파일·라인에서 동작하는지 흐름으로 보여 주고(FR-04·FR-14·FR-15·FR-05, E1·E2), ② 기능→파일 역할→코드→개념 순서로 설명하면서 '왜 이렇게 구현했는지'를 코드 근거와 함께 풀어 주고(FR-06, E2·SRC-1), ③ 바꾸고 싶은 동작을 문장으로 넣으면 고칠 위치를 찾아 주되 코드를 대신 고치지는 않으며(FR-11, E1), ④ 퀴즈와 작은 수정 미션으로 이해를 확인하고(FR-07·FR-08, SRC-6의 안내된 디버깅 발판), ⑤ 분석 결과를 학습 노트로 내려받아 몇 달 뒤 다시 열 때 처음부터 다시 읽지 않게 하고(FR-12, E2), ⑥ 로그인한 사용자의 분석한 저장소·퀴즈 결과·미션 완료 여부를 '내 학습 기록'에 남겨 다시 분석하지 않고 이어서 볼 수 있게 한다(FR-10·FR-13, E2). 만들지 않는다 — 코드 자동 수정·저장소 푸시(SRC-6의 검증 위임을 키움), 저장소 코드 실행, 결제."
features:
  - id: FR-01
    name: "공개 GitHub 저장소 연결"
    input: "로그인한 사용자가 홈의 'GitHub 프로젝트 분석하기'에서 입력한 공개 GitHub 저장소 URL(https://github.com/owner/repo)"
    output: "저장소 이름·기본 브랜치·분석 기준 commit SHA가 화면에 표시되고, 이 commit 기준으로 분석 결과가 저장된다."
    done: |-
      공개 저장소 URL을 넣고 '분석 시작'을 누르면 저장소 이름·기본 브랜치·commit SHA가 보인다.
      잘못된 URL, 없는 저장소(404), 비공개 저장소, GitHub 요청 한도 초과는 각각 다른 안내 문구를 보여 주고 결과 화면으로 넘어가지 않는다.
  - id: FR-02
    name: "분석 제외 파일 처리"
    input: "FR-01에서 연결한 저장소 (사용자가 따로 넣는 것 없음)"
    output: "분석에 쓴 파일 수와 제외한 파일 수가 분석 결과 화면에 표시된다."
    done: |-
      node_modules, .git, dist, build, .next, lockfile, 바이너리 파일은 분석 파일 목록에 나오지 않는다.
      .env, 비밀키·인증서 파일은 AI 입력에 들어가지 않고 '민감 파일 제외' 개수로만 표시된다.
      화면에 나오는 모든 파일 경로는 분석 기준 commit에 실제로 있는 경로다.
  - id: FR-03
    name: "프로젝트 소개"
    input: "FR-01에서 연결한 저장소 (분석이 끝나면 자동)"
    output: "분석 결과 화면 맨 위에 프로젝트 한 줄 소개, 기술 스택 한 줄 요약(기술 이름만), 주요 폴더와 각 폴더의 역할(화면·서버·DB·설정)이 표시된다. 기술마다의 역할과 근거는 FR-04에서 보여 준다."
    done: |-
      소개 옆에 근거로 쓴 파일 경로(README 등)가 보인다. README가 없어 코드로만 추정한 소개는 'AI 추정'으로 표시된다.
      기술 스택 요약에는 FR-04 '사용한 기술'에 있는 기술 이름만 나온다.
      주요 폴더마다 폴더 경로와 화면·서버·DB·설정 중 하나의 역할이 보이고, 판단 근거를 찾지 못한 폴더는 '확인 불가'로 표시된다.
  - id: FR-04
    name: "사용한 기술·기능 목록"
    input: "FR-01에서 연결한 저장소 (분석이 끝나면 자동)"
    output: "분석 결과 화면에 '사용한 기술'과 '기능' 두 구역이 표시된다. '사용한 기술'에는 기술마다 이름·근거 파일 경로·이 프로젝트에서 맡은 역할이, '기능'에는 사용자가 화면에서 쓰는 기능 2~5개의 제목·한 줄 설명·근거 파일 경로가 보인다."
    done: |-
      '사용한 기술'에는 기술이 1개 이상, '기능'에는 기능이 2~5개 보인다.
      기술·기능 항목마다 분석 기준 commit에 실제로 있는 근거 파일 경로(package.json 등)가 1개 이상 보인다.
      항목을 누르면 기술은 기술 상세(FR-14), 기능은 기능 상세(FR-15)로 이동한다.
      기능을 찾지 못하면 꾸며 내지 않고 '기능을 찾지 못했습니다'를 보여 주고 '사용한 기술' 구역만 보여 준다.
  - id: FR-05
    name: "기능 동작 흐름(화면→서버→DB)"
    input: "기능 상세(FR-15)에서 '이 기능 어떻게 동작해?' 클릭"
    output: "선택한 기능이 화면 → 상태·로직 → 서버/API → DB 순서로 어느 파일에서 동작하는지 단계별 파일 카드로 표시된다."
    done: |-
      단계마다 파일 경로, 시작·끝 라인, 코드 발췌가 보이고 '다음 단계'로 다음 파일 카드가 열린다.
      저장소에 서버·DB 코드(API 라우트, 스키마, 쿼리)가 있으면 그 단계 카드가 흐름에 포함된다. 없으면 '이 저장소에서 확인되지 않음'으로 표시한다.
      코드에서 확인하지 못한 연결은 'AI 추정'으로 구분해 표시하고 확정된 연결처럼 그리지 않는다.
  - id: FR-06
    name: "Top-down 학습과 '왜 이렇게 만들었나'"
    input: "기능 상세(FR-15)에서 '이 코드 배우기' 클릭, 필요하면 '쉬운 설명 펼치기' 클릭"
    output: "기능 설명, 파일 역할, 중요한 코드, 핵심 개념의 4개 섹션과 '왜 이렇게 만들었나'(이 구현 방식을 쓴 이유) 설명이 표시된다."
    done: |-
      핵심 개념마다 그 개념이 쓰인 파일 경로와 라인 범위가 붙어 있다.
      '쉬운 설명 펼치기'를 누르면 용어 풀이와 '왜 필요한가' 설명이 펼쳐진다.
      '왜 이렇게 만들었나'는 근거 코드 위치와 함께 보이고, 코드로 확인할 수 없는 이유는 'AI 추정'으로 표시된다.
  - id: FR-07
    name: "이해도 퀴즈"
    input: "'이해도 확인' 클릭 후 보기 선택, '정답 확인' 클릭"
    output: "정답 여부, 그 이유, 참고할 코드 위치(파일 경로·라인)가 표시된다."
    done: |-
      선택한 기능의 코드에 관한 질문이 1~3개 나온다.
      정답·오답 모두 이유와 코드 위치가 보인다.
      퀴즈 결과로 실제 수정 능력을 보장한다는 문구는 쓰지 않는다.
      '정답 확인' 결과는 '내 학습 기록'에 저장된다(FR-13).
  - id: FR-08
    name: "직접 수정 미션"
    input: "'이제 네가 직접 바꿔봐' 클릭, 성공 조건 체크박스 선택, '완료로 표시' 클릭"
    output: "변경 목표, 예상 수정 파일·라인, 힌트, 성공 조건이 표시되고, 완료 상태가 화면에 남는다."
    done: |-
      성공 조건을 모두 체크해야 '완료로 표시'를 누를 수 있다.
      완료 표시 옆에 '자기 보고이며 실행 결과를 보증하지 않음' 문구가 보인다.
      서비스가 코드를 자동 수정하거나 저장소에 푸시하지 않는다.
      완료 표시는 '내 학습 기록'에 저장된다(FR-13).
  - id: FR-09
    name: "코드 변경 정적 피드백 (우선순위 P1, 대회 흐름 제외)"
    input: "사용자가 붙여 넣은 코드 조각이나 diff"
    output: "붙여 넣은 변경이 미션의 성공 조건을 채우는지에 대한 피드백(충족·미충족 조건, 개선 힌트)이 표시된다."
    done: |-
      실제 실행·테스트를 하지 않았으므로 '추정 결과'라는 표시가 함께 보인다.
      붙여 넣은 텍스트에 비밀값으로 보이는 문자열이 있으면 전송 전에 경고하고 보내지 않는다.
  - id: FR-10
    name: "회원가입·로그인"
    input: "회원가입 화면에서 이름·이메일·비밀번호(8자 이상) 입력 후 '회원가입' 클릭, 또는 로그인 화면에서 이메일·비밀번호 입력 후 '로그인' 클릭"
    output: "계정이 만들어지거나 로그인되어 홈으로 이동하고, 홈 오른쪽 위에 '<이름>님'과 '로그아웃'이 표시된다."
    done: |-
      이름이 비었거나 이메일 형식이 틀리거나 비밀번호가 8자 미만이면 해당 입력란 아래에 이유가 보이고 계정이 만들어지지 않는다.
      회원가입하면 바로 로그인 상태가 된다. 이미 가입한 이메일, 틀린 비밀번호는 각각 다른 안내 문구를 보여 주고 로그인되지 않는다.
      비밀번호는 해시로만 저장하고, 로그인 유지는 httpOnly 쿠키의 세션으로 한다. '로그아웃'을 누르면 세션이 삭제된다.
      docker-compose.yml의 시드 계정(SEED_USER_EMAIL·SEED_USER_PASSWORD)으로 빈 DB에서도 바로 로그인된다.
  - id: FR-11
    name: "고칠 위치 찾기"
    input: "분석 결과 화면의 '어디를 고쳐야 해?' 입력란에 바꾸고 싶은 동작을 문장으로 입력하고 '위치 찾기' 클릭 (입력란 아래에 이 저장소에 맞는 예시 문장이 보이고, 누르면 입력란에 들어감)"
    output: "고쳐야 할 파일 경로·라인 목록이 표시되고, 위치마다 화면·서버·DB 중 어디인지와 그곳을 고치면 되는 이유, 그리고 원래 코드에서 바꿔야 하는 줄이 하이라이트된 코드 발췌가 함께 보인다."
    done: |-
      결과의 파일 경로·라인은 분석 기준 commit에 실제로 있는 위치다.
      위치마다 '화면'·'서버'·'DB' 중 하나가 표시된다.
      원래 코드 발췌에서 바꿔야 하는 줄만 하이라이트하고, 수정된 코드나 붙여 넣을 코드는 보여 주지 않는다(직접 고치도록 FR-08 미션으로 이어 준다).
      관련 위치를 찾지 못하면 '찾지 못했습니다'와 함께 '기능' 목록에서 흐름을 보라고 안내한다.
  - id: FR-12
    name: "학습 노트 내려받기"
    input: "분석 결과 화면의 '학습 노트 내려받기' 클릭"
    output: "프로젝트 이름, 분석 기준 commit SHA, 프로젝트 소개, 사용한 기술(역할·근거 파일), 기능별 근거 파일 경로가 담긴 PDF 파일이 내려받아진다."
    done: |-
      내려받은 파일 안의 commit SHA와 파일 경로가 화면에 보인 값과 같다.
      '내 학습 기록'에서 다시 연 저장소에서도 분석을 다시 하지 않고 같은 내용으로 내려받을 수 있다.
  - id: FR-13
    name: "내 학습 기록"
    input: "로그인한 사용자가 화면 위쪽의 '내 학습 기록' 클릭, 목록에서 저장소 클릭"
    output: "내가 분석한 저장소 목록(저장소 이름·분석 날짜·분석 기준 commit SHA)과 저장소별 퀴즈 결과(맞힌 수/푼 문항 수), 수정 미션 완료 여부가 표시된다."
    done: |-
      로그아웃 후 다시 로그인해도 같은 목록과 결과가 보인다.
      목록에서 저장소를 누르면 분석을 다시 하지 않고 그 commit 기준 분석 결과 화면이 열린다.
      다른 사용자의 저장소·퀴즈·미션 기록은 보이지 않는다.
  - id: FR-14
    name: "기술 상세"
    input: "FR-04 '사용한 기술' 목록에서 기술 클릭"
    output: "기술 상세 화면에 그 기술의 이름, 이 프로젝트에서 맡은 역할, 핵심 개념 설명, 그 기술이 쓰인 파일 경로·라인과 코드 발췌가 표시된다."
    done: |-
      그 기술이 쓰인 위치가 1개 이상 보이고, 모두 분석 기준 commit에 실제로 있는 파일 경로·라인이다.
      핵심 개념 설명은 이 프로젝트 코드에서 그 기술이 쓰인 위치와 함께 보인다.
