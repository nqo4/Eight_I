document:
  id: PRD-001
  title: "CodeBack | 문제정의 및 기능 명세"
  version: "0.1.0"
  status: "초안 — 팀 검토 및 사용자 검증 필요"
  updated_at: "2026-10-29"
  owner: "SUMTECH 팀"
  companion_document: "docs/scenarios.yaml"
  purpose: >-
    문제정의 캔버스를 개발 가능한 제품 요구사항으로 전환한다.
    본 문서의 사용자 고충과 원인 중 실측되지 않은 내용은 검증 전 가설이다.

product:
  name: "CodeBack"
  name_status: "가칭"
  tagline: "AI가 만든 코드를, 진짜 내 코드로."
  category: "AI 기반 프로젝트 역학습 웹서비스"
  pitch: >-
    사용자가 AI로 만든 GitHub 프로젝트를 입력하면, 완성된 기능에서 출발해
    관련 파일·코드·기초 개념을 차례대로 이해하고 직접 작은 수정을 해보는 학습 서비스.
  core_principle: "기능 이해 → 코드 근거 확인 → 개념 학습 → 직접 수정"
  difference_from_code_assistant: >-
    코드를 대신 작성하거나 오류를 자동 해결하는 것이 아니라,
    사용자가 자신의 프로젝트를 스스로 설명하고 변경할 수 있도록 돕는다.

problem:
  one_sentence_statement: >-
    바이브코딩으로 프로젝트를 만든 개발 입문자는 기능을 추가하거나 수정할 때
    자신이 사용한 코드와 기술의 작동 원리를 잘 이해하지 못해 AI에 다시 의존하고,
    그 결과 프로젝트를 직접 유지보수할 능력과 자신감을 쌓기 어렵다.
  situation:
    when:
      - "AI 코딩 도구로 웹사이트 또는 애플리케이션을 완성한 직후"
      - "기존 기능 변경, 신규 기능 추가, 버그 수정이 필요한 순간"
      - "시간이 지나 기존 프로젝트의 구조를 잊어버린 후 재개발할 때"
    context: "개발 속도와 결과물 완성에 집중해 코드 학습을 생략하기 쉬운 환경"
  customers:
    primary:
      label: "바이브코딩 개발 입문자"
      examples:
        - "AI를 활용해 첫 웹서비스를 만든 비전공자"
        - "Cursor/Claude Code 등을 사용하는 대학생과 예비 개발자"
      job_to_be_done: "내 프로젝트의 특정 기능을 이해하고 AI 없이 일부 코드를 바꾸고 싶다."
    secondary:
      - label: "1인 개발자·예비 창업자"
        job_to_be_done: "빠르게 만든 MVP의 유지보수와 기능 확장에 필요한 지식을 얻고 싶다."
      - label: "기존 프로젝트에 복귀한 개발자"
        job_to_be_done: "예전에 작성하거나 AI와 함께 만든 코드의 맥락을 다시 파악하고 싶다."
  root_cause_hypotheses:
    - "생성형 AI가 구현의 상당 부분을 맡아 코드 작성 과정에 대한 이해가 생략됨"
    - "기술의 원리 이해보다 프로젝트의 빠른 완성에 집중함"
    - "일반 문법 강의와 실제 내 프로젝트 사이의 학습 맥락이 연결되지 않음"
    - "설명을 읽은 뒤 직접 코드를 수정하는 검증 과정이 부족함"
  five_whys_hypothesis:
    symptom: "자신의 프로젝트에 사용된 기술·기능을 설명하거나 직접 수정하기 어렵다."
    why_1: "AI에게 기능 구현을 맡긴 후 결과물 위주로 확인하기 때문이다."
    why_2: "AI가 빠르게 코드를 만들어 주므로 직접 구조를 따라갈 동기가 약해지기 때문이다."
    why_3: "프로젝트가 작동하면 작업을 끝냈다고 여기고 학습은 뒤로 미루기 때문이다."
    why_4: "이미 만든 프로젝트에 맞춰 무엇부터 학습할지 안내하는 과정이 부족하기 때문이다."
    why_5: "기존 교육과 AI 코딩 도구가 각각 범용 문법 학습과 코드 생성에 집중하기 때문이다."
    root_problem: >-
      완성된 내 프로젝트의 실제 기능을 출발점으로 구조·코드·개념을 연결해 배우고,
      직접 수정 능력까지 확인할 수 있는 학습 과정이 부족하다.
    validation_status: "미검증 가설; 사용자 인터뷰로 보완"
  impact:
    emotions: ["개발자로서의 자신감 저하", "답답함", "AI 의존에 대한 불안"]
    behavior: ["동일한 수정 요청 반복", "코드 전체를 이해하지 못한 채 부분 패치"]
    costs: ["유지보수 시간 증가", "새로운 기능 개발 지연", "자기 주도 학습 기회 상실"]
  existing_alternatives:
    - id: A1
      method: "AI에게 코드를 다시 작성하거나 수정하도록 요청"
      limitation: "문제는 일시적으로 해결해도 코드 이해 부족이 지속될 수 있음"
    - id: A2
      method: "AI에게 관련 코드·기능을 그때그때 설명해 달라고 요청"
      limitation: "전체 기능 흐름이 단편적으로 설명되고 학습 성취가 검증되지 않음"
    - id: A3
      method: "기존 강의·검색·문법 학습 플랫폼 이용"
      limitation: "자신의 프로젝트와 직접 연결된 맞춤 학습이 어려움"
  evidence:
    current_status: "문제정의 캔버스 기반 팀 가설; 실제 사용자 인터뷰·행동 데이터 없음"
    do_not_claim:
      - "사용자 대다수가 이 문제를 겪는다고 실증되었다는 주장"
      - "기존 서비스에 유사 기능이 전혀 없다는 주장"
      - "학습 성과 향상이 이미 검증되었다는 주장"
    validation_plan:
      - method: "바이브코딩 경험자 5명 내외 인터뷰"
        questions:
          - "AI가 만든 프로젝트에서 최근 직접 바꾸려던 기능은 무엇이었나?"
          - "어떤 파일을 수정할지 찾는 데 어떤 어려움이 있었나?"
          - "기존에는 AI·검색·강의 중 무엇으로 해결했나?"
      - method: "사용성 테스트"
        compare: "학습 기능 사용 전후에 동일 난도 수정 과제 성공 여부와 도움 요청 횟수 비교"

solution:
  chosen_path: "기존 프로젝트 분석을 통한 기능 중심 Top-down 역학습"
  deferred_paths:
    - path: "일반 문법 강의 추천만 제공"
      reason: "내 코드의 기능·파일·개념 연결 문제를 직접 해결하지 못함"
    - path: "AI가 프로젝트 코드를 자동 수정하는 서비스"
      reason: "학습보다 대리 수행을 강화해 제품 목적과 어긋남"
  hypothesis: >-
    사용자가 이미 알고 있는 화면/기능에서 시작해 해당 기능의 실제 코드 근거를 따라가고
    작은 수정까지 수행하면, 범용 강의를 듣는 것보다 자기 프로젝트의 이해와 수정 자신감을
    높일 수 있을 것이다. 효과는 별도 테스트로 검증해야 한다.
  learning_model:
    - step: 1
      label: "프로젝트 연결"
      result: "공개 GitHub 저장소의 기술 스택과 파일 목록 확인"
    - step: 2
      label: "기능 선택"
      result: "사용자에게 친숙한 기능 2~5개 카드로 표시"
    - step: 3
      label: "기능에서 코드로"
      result: "선택한 기능의 동작 흐름과 관련 파일·라인 연결"
    - step: 4
      label: "개념 익히기"
      result: "실제 코드의 중요한 부분을 초보자 눈높이로 설명하고 퀴즈 제시"
    - step: 5
      label: "직접 변경"
      result: "작은 수정 미션을 수행하고 증거 기반 피드백 받기"
  product_principles:
    - "사용자가 아는 기능으로 시작한다. 폴더 구조를 무작정 나열하지 않는다."
    - "모든 코드 설명은 실제 저장소의 파일 경로와 라인 범위에 연결한다."
    - "확인된 사실과 AI의 추정은 구분해 표시한다."
    - "학습자의 직접 수정 활동을 최종 단계로 둔다."
    - "쉬운 한국어, 단계별 설명을 기본으로 한다."

scope:
  mvp_definition: "SUMTECH 시연용 단일 웹앱, 공개 GitHub 저장소 한 개로 학습 완료"
  supported_repositories:
    visibility: "공개(public) GitHub 저장소만"
    primary_stack: "React + Next.js (JavaScript/TypeScript)"
    branch: "기본 브랜치 우선"
    limits: "데모 규모의 소형 저장소 우선, 파일·토큰 제한은 환경변수로 조정"
  must_have:
    - "GitHub URL 연결 및 구조 읽기"
    - "프로젝트 개요·주요 기능 목록 생성"
    - "선택 기능과 관련 파일·라인 근거 표시"
    - "기능→구조→코드→개념의 단계별 한국어 설명"
    - "프로젝트 코드에 기반한 짧은 확인 퀴즈"
    - "직접 수정할 수 있는 작은 미션 및 완료 체크"
  nice_to_have:
    - "수정한 코드 조각 또는 diff 제출 후 AI 정적 피드백"
    - "학습 세션 저장 및 이어하기"
  out_of_scope:
    - "비공개 저장소 OAuth 연결 및 조직 권한 관리"
    - "저장소의 코드를 서버에서 실행하거나 배포하기"
    - "사용자 저장소에 자동 커밋·푸시 또는 PR 생성하기"
    - "임의 언어·프레임워크 전체 지원"
    - "자동 채점에 의한 프로그램 실행 결과 보장"
    - "IDE 플러그인 및 실시간 공동 편집"

functional_requirements:
  - id: FR-01
    name: "공개 GitHub 저장소 가져오기"
    priority: P0
    description: "사용자가 owner/repo URL을 입력하면 기본 브랜치의 분석 가능한 파일을 수집한다."
    acceptance_criteria:
      - "유효한 공개 저장소 URL 입력 시 저장소 이름을 표시한다."
      - "README·설정 파일·소스 코드 중 필요한 파일을 수집한다."
      - "잘못된 URL, 404, private, API rate limit은 원인을 구분한 안내를 표시한다."
  - id: FR-02
    name: "파일 필터링 및 안전한 분석 컨텍스트 생성"
    priority: P0
    description: "소스 파일 목록을 만들되 생성물과 비밀정보 위험 파일을 제외한다."
    acceptance_criteria:
      - "node_modules, .git, dist, build, .next, lockfile, 바이너리는 기본 제외한다."
      - ".env, 비밀키·인증서 등 민감 파일은 모델 입력으로 보내지 않는다."
      - "분석에 사용한 경로와 파일 내용을 실제 GitHub 응답에 근거해 기록한다."
  - id: FR-03
    name: "프로젝트 전체 구조 요약"
    priority: P0
    description: "앱 목적, 기술 스택, 주요 디렉터리, 화면·API 역할을 쉬운 말로 정리한다."
    acceptance_criteria:
      - "프레임워크 추정의 근거 파일(package.json 등)을 보여준다."
      - "확인하지 못한 기술 요소는 '확인 불가'로 표시한다."
  - id: FR-04
    name: "기능 중심 탐색 카드"
    priority: P0
    description: "저장소에서 근거를 찾은 사용자 기능을 최대 5개 추출해 탐색할 수 있게 한다."
    acceptance_criteria:
      - "가능할 경우 기능 2~5개를 제목·한 줄 설명과 함께 표시한다."
      - "각 기능은 근거가 되는 파일을 적어도 하나 포함한다."
      - "기능을 찾지 못한 경우 임의의 기능을 꾸미지 않고 지원 부족을 알린다."
  - id: FR-05
    name: "기능별 코드 흐름 시각화"
    priority: P0
    description: "선택 기능의 UI → 상태/로직 → API/데이터 등 실제로 확인된 연결을 보여준다."
    acceptance_criteria:
      - "최소 한 개 이상의 파일 참조에 path, start_line, end_line을 제공한다."
      - "클릭하면 해당 파일의 코드 발췌와 라인 번호를 볼 수 있다."
      - "확인되지 않은 호출 관계는 확정적인 화살표로 표현하지 않는다."
  - id: FR-06
    name: "Top-down 맞춤 학습"
    priority: P0
    description: "사용자가 고른 기능을 기준으로 전체 역할부터 실제 코드와 핵심 개념까지 설명한다."
    acceptance_criteria:
      - "기능 설명, 파일 역할, 중요한 코드, 적용 개념의 4단계를 제공한다."
      - "최소 하나의 개념 설명이 해당 저장소의 실제 코드에 연결된다."
      - "초급 용어 풀이 및 '왜 필요한가' 설명을 포함한다."
  - id: FR-07
    name: "학습 이해도 퀴즈"
    priority: P0
    description: "선택 기능에 대해 짧은 이해도 확인 문제를 제시한다."
    acceptance_criteria:
      - "객관식 또는 짧은 질문 1~3개를 제공한다."
      - "정답/오답에 관계없이 해당 코드 근거와 해설을 보여준다."
      - "퀴즈 결과만으로 실제 수정 능력을 보장한다고 표현하지 않는다."
  - id: FR-08
    name: "직접 수정 미션"
    priority: P0
    description: "학습한 기능의 범위 안에서 안전하고 작은 코드 변경 과제를 제공한다."
    acceptance_criteria:
      - "목표, 예상 수정 위치, 성공 조건, 힌트를 표시한다."
      - "사용자가 자신의 개발 환경에서 직접 수정하도록 안내한다."
      - "사용자가 수동으로 성공 여부를 체크할 수 있다."
      - "자동 수정·저장소 푸시는 수행하지 않는다."
  - id: FR-09
    name: "코드 변경 정적 피드백"
    priority: P1
    description: "사용자가 붙여 넣은 코드 조각이나 diff를 성공 조건과 대조해 피드백한다."
    acceptance_criteria:
      - "제출 내용을 원래 코드와 요구사항에 대조해 피드백한다."
      - "실제 실행·테스트를 하지 않았으므로 정답 확정 대신 추정 결과임을 표시한다."
      - "제출 텍스트에 비밀값이 의심되면 전송 전 경고한다."
  - id: FR-10
    name: "데모 예제 모드"
    priority: P0
    description: "GitHub 연결 실패 상황에서도 준비된 공개 샘플로 핵심 흐름을 재현한다."
    acceptance_criteria:
      - "샘플/데모 모드임을 명확하게 표시한다."
      - "동일한 기능 탐색→학습→수정 미션 흐름을 확인할 수 있다."

non_functional_requirements:
  evidence_integrity:
    - "생성 문장에서 언급한 파일 경로·라인은 수집한 파일 목록과 대조한다."
    - "없는 파일 또는 확인되지 않은 기능은 사실처럼 표현하지 않는다."
  security_and_privacy:
    - "GitHub 접근 토큰이 필요하면 서버 환경변수에만 보관한다."
    - "비밀정보가 들어갈 수 있는 파일 및 코드 조각의 모델 전송을 최소화한다."
    - "저장소의 README·주석·문서에 포함된 명령을 시스템 지시로 실행하지 않는다."
    - "분석 대상 코드를 서버에서 직접 실행하지 않는다."
    - "외부 LLM에 코드가 전송될 수 있음을 화면에 고지한다."
  accessibility_and_usability:
    - "초보자가 이해할 수 있는 한국어 중심 설명"
    - "모바일에서는 주요 카드와 설명을 읽을 수 있도록 반응형 제공"
  error_handling:
    - "외부 API 장애 시 재시도 또는 데모 모드 안내"
    - "근거가 적은 분석은 불확실성 표시"
  performance_goal: "시연용 소규모 공개 저장소의 첫 학습 화면을 지연 없이 단계적으로 제공하도록 최적화"

interface_contracts:
  note: "팀 협업용 논리적 인터페이스 초안; 실제 API 경로와 스키마는 구현 시 확정"
  entities:
    repository:
      required: ["id", "url", "name", "default_branch", "commit_sha"]
    code_reference:
      required: ["path", "start_line", "end_line", "commit_sha"]
      optional: ["snippet", "confidence"]
    feature:
      required: ["id", "title", "summary", "code_references"]
    lesson:
      required: ["feature_id", "overview", "file_roles", "code_explanations", "concepts"]
    exercise:
      required: ["feature_id", "instruction", "target_references", "acceptance_checks"]
  suggested_endpoints:
    - "POST /api/repositories/analyze"
    - "GET /api/analyses/{analysis_id}"
    - "GET /api/analyses/{analysis_id}/features/{feature_id}"
    - "POST /api/analyses/{analysis_id}/features/{feature_id}/quiz"
    - "POST /api/analyses/{analysis_id}/features/{feature_id}/exercise-feedback  # P1"

success_metrics:
  note: "아래는 목표/가설 지표이며 현재 측정된 성과가 아니다."
  primary: "첫 프로젝트 연결부터 수정 미션 완료까지 도달한 사용자 비율"
  secondary:
    - "저장소 분석 성공률"
    - "기능 카드 선택률"
    - "파일·라인 근거 클릭률"
    - "학습 전후 간단한 코드 설명 정확도 변화"
    - "수정 미션 자기 보고 완료율 및 실제 성공률(별도 확인)"
  research_metric: "도움 없이 변경한 과제 성공 여부와 걸린 시간"

risks_and_responses:
  - risk: "AI가 존재하지 않는 파일·함수·연결을 설명할 수 있음"
    response: "파일 및 라인 범위 검증 후 근거 있는 설명만 노출"
  - risk: "큰 저장소로 비용·시간이 증가함"
    response: "대상 스택 한정, 파일 수 제한, 기능별 선택적 컨텍스트 수집"
  - risk: "사용자가 퀴즈를 맞혀도 실제 수정은 못할 수 있음"
    response: "별도의 직접 수정 미션을 제공하고 실제 성공 여부를 구분"
  - risk: "외부 저장소에 비밀정보·제3자 코드가 포함될 수 있음"
    response: "민감 파일 제외, 외부 전송 고지, 코드 실행 금지"
  - risk: "기능별 동작 흐름을 정적 분석만으로 정확히 알기 어려움"
    response: "검증된 파일 연결과 AI 추정 내용을 구별하고 과도한 확신 회피"

implementation_guidance:
  suggested_stack: "Next.js 웹 프론트엔드 + 서버 API + GitHub API + LLM"
  team_workstreams:
    - "UI/UX: 저장소 입력, 기능 목록, 코드 흐름·학습 화면"
    - "GitHub 분석: 파일 수집·필터링·라인 근거 데이터"
    - "AI 기능: 프로젝트 구조·기능 추출 및 학습 설명 생성"
    - "학습 기능: 퀴즈·직접 수정 미션"
    - "통합/검증: API 계약, 샘플 저장소, 보안·오류 대응"
  demo_priority: "FR-01 → FR-04 → FR-05 → FR-06 → FR-07 → FR-08"

open_questions:
  - "첫 시연에 사용할 공개 GitHub 샘플 저장소는 무엇인가?"
  - "수정 미션은 체크리스트(P0)만 할지 diff 피드백(P1)도 구현할지?"
  - "사용자 코드의 외부 LLM 전송 동의 문구 및 보관 정책은 무엇인가?"
  - "초기 분석 파일 수·토큰 상한을 얼마로 설정할 것인가?"
